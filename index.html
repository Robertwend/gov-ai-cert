見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"契約應明定資料權利、資安、紀錄、測試、變更、事故、SLA、移轉與終止責任"},{"label":"常見陷阱／為何","text":"採購是治理工具；外包不外卸公法責任，關鍵控制要寫進契約並可驗證。"}],"sourceSection":"6｜2.1 AI政策與治理指引"},{"id":"C131","category":"chapters","group":"2.2","title":"2.2 記憶句","front":"請回想 2.2 的章節記憶句。","fields":[{"label":"記憶句","text":"不能放、不能信、不能直出；能控權、能稽核、能復原。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C132","category":"chapters","group":"2.2","title":"2.2｜01｜秘密文書與生成式AI","front":"「秘密文書與生成式AI」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"機密文書應由承辦人撰寫，不得使用生成式AI處理"},{"label":"常見陷阱／為何","text":"參考指引對秘密文書採明確限制；不能用去標示或事後刪除取代規範。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C133","category":"chapters","group":"2.2","title":"2.2｜02｜機密、個資與未公開資訊輸入","front":"「機密、個資與未公開資訊輸入」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"不得將機密、個人資料或未公開資訊提供給外部生成式AI，也不得詢問相關問題"},{"label":"常見陷阱／為何","text":"風險包括留存、訓練、跨境、供應商存取與再識別；應在輸入前阻止。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C134","category":"chapters","group":"2.2","title":"2.2｜03｜封閉／地端環境的使用條件","front":"「封閉／地端環境的使用條件」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"須先確認安全性並依資料分級、權限與機關規範使用，不能因地端就自動放行"},{"label":"常見陷阱／為何","text":"封閉環境降低部分外傳風險，但仍有權限、內部人、供應鏈、模型與終端安全。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C135","category":"chapters","group":"2.2","title":"2.2｜04｜不得完全信任或作為唯一依據","front":"「不得完全信任或作為唯一依據」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"AI輸出須查證，不得直接作成行政行為或作為唯一判斷依據"},{"label":"常見陷阱／為何","text":"行政行為涉及法定權限與人民權益，必須有專業判斷、法源核對與責任人。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C136","category":"chapters","group":"2.2","title":"2.2｜05｜生成式AI使用揭露","front":"「生成式AI使用揭露」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"依情境適度揭露使用AI及其角色，避免使民眾誤認完全由人產出或審查"},{"label":"常見陷阱／為何","text":"揭露應與風險、影響與使用方式相稱；透明不取代品質與法遵。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C137","category":"chapters","group":"2.2","title":"2.2｜06｜法規遵循與機關內控","front":"「法規遵循與機關內控」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"應遵守資安、個資、著作權及資訊處理規範，機關並可制定更具體控制"},{"label":"常見陷阱／為何","text":"參考指引是底線框架，實際使用還要套用個別法規、資料分類與內控。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C138","category":"chapters","group":"2.2","title":"2.2｜07｜委外廠商遵循義務","front":"「委外廠商遵循義務」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"採購契約應要求廠商遵守指引與機關規範，並約定稽核、通報和資料處理責任"},{"label":"常見陷阱／為何","text":"供應鏈也是資料與模型風險的一部分；義務必須可執行、可稽核並有違約處理。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C139","category":"chapters","group":"2.2","title":"2.2｜08｜採購底價與保留資訊","front":"「採購底價與保留資訊」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"採購底價、評選未公開內容等不得輸入外部生成式AI"},{"label":"常見陷阱／為何","text":"未公開採購資訊涉及公平、廉政、營業與機關權益，應受嚴格輸入限制。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C140","category":"chapters","group":"2.2","title":"2.2｜09｜身分證號與個資","front":"「身分證號與個資」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"身分證號等可直接或間接識別個人的資料，應依目的、必要性與安全措施處理"},{"label":"常見陷阱／為何","text":"個資保護涵蓋蒐集、處理、利用與安全；技術措施不能取代合法目的與最小化。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C141","category":"chapters","group":"2.2","title":"2.2｜10｜未公開政策草案","front":"「未公開政策草案」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"未公開政策、會議資料與內部意見不得任意輸入外部生成式AI"},{"label":"常見陷阱／為何","text":"未公開不只等於機密；參考指引明確涵蓋依法應保密或未公開資訊。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C142","category":"chapters","group":"2.2","title":"2.2｜11｜內部簽核意見","front":"「內部簽核意見」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"內部簽辦、會議意見與權責判斷可能屬未公開或受限制資訊，應先依規範分類"},{"label":"常見陷阱／為何","text":"是否可輸入要看內容、法規、公開狀態與服務條款，不可只做表面去識別。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C143","category":"chapters","group":"2.2","title":"2.2｜12｜影子AI（Shadow AI）","front":"「影子AI（Shadow AI）」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"未經核准的AI工具、帳號或流程會繞過安全、採購與紀錄控制"},{"label":"常見陷阱／為何","text":"影子AI常因方便而出現；治理需有允許清單、教育、替代工具、偵測與處理程序。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C144","category":"chapters","group":"2.2","title":"2.2｜13｜最小權限與職務分離","front":"「最小權限與職務分離」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"依角色授與最少必要權限，將開發、核准、部署與稽核適度分離"},{"label":"常見陷阱／為何","text":"最小權限限制損害，職務分離降低單點濫用與錯誤。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C145","category":"chapters","group":"2.2","title":"2.2｜14｜日誌與稽核軌跡","front":"「日誌與稽核軌跡」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"記錄誰在何時以何權限使用哪些版本、資料與工具，以及核准與輸出處理"},{"label":"常見陷阱／為何","text":"日誌應最小且足夠，並受存取、保存與完整性保護，以支援追查與問責。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C146","category":"chapters","group":"2.2","title":"2.2｜15｜傳輸與儲存安全","front":"「傳輸與儲存安全」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"敏感資料應依規範加密傳輸與儲存、妥善管理金鑰並限制存取"},{"label":"常見陷阱／為何","text":"加密是重要防線，但須搭配金鑰管理、端點安全、備份與權限。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C147","category":"chapters","group":"2.2","title":"2.2｜16｜提示注入","front":"「提示注入」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"攻擊者把惡意指令藏在使用者輸入、網頁或文件，誘使模型忽略原規則或洩密"},{"label":"常見陷阱／為何","text":"應以指令分層、外部內容隔離、工具權限、輸出檢查與人工核准降低風險。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C148","category":"chapters","group":"2.2","title":"2.2｜17｜對抗樣本","front":"「對抗樣本」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"攻擊者對輸入做細微設計，使模型產生錯誤分類或行為"},{"label":"常見陷阱／為何","text":"對抗攻擊利用模型弱點；可用魯棒性測試、輸入檢查、監測與分層防禦。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C149","category":"chapters","group":"2.2","title":"2.2｜18｜資料投毒","front":"「資料投毒」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"在訓練或回饋資料中植入惡意或偏誤內容，改變模型行為"},{"label":"常見陷阱／為何","text":"需控管資料來源、版本、完整性、標註、異常與供應鏈。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C150","category":"chapters","group":"2.2","title":"2.2｜19｜模型抽取","front":"「模型抽取」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"攻擊者透過大量查詢推測或複製模型能力、參數或敏感行為"},{"label":"常見陷阱／為何","text":"可用身分驗證、速率限制、異常偵測、輸出限制與契約控制降低模型竊取。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C151","category":"chapters","group":"2.2","title":"2.2｜20｜AI供應鏈風險","front":"「AI供應鏈風險」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"模型、資料、開源套件、API與雲端服務任一環節都可能引入漏洞、權利或持續供應風險"},{"label":"常見陷阱／為何","text":"應盤點元件、來源、版本、授權、弱點、更新、次處理者與退出安排。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C152","category":"chapters","group":"2.2","title":"2.2｜21｜AI資安事件應變","front":"「AI資安事件應變」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"事前定義偵測、通報、隔離、證據保存、復原、通知與改善責任"},{"label":"常見陷阱／為何","text":"AI事件可能同時涉及資料、模型、服務與權利，需與既有資安及個資應變整合。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C153","category":"chapters","group":"2.2","title":"2.2｜22｜ISO/IEC 42001","front":"「ISO/IEC 42001」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"以PDCA建立、實施、維持並持續改善AI管理系統，治理組織的AI風險與機會"},{"label":"常見陷阱／為何","text":"42001是管理系統標準，重點在政策、角色、風險、控制、監測與持續改善。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C154","category":"chapters","group":"2.2","title":"2.2｜23｜不可接受與高風險","front":"「不可接受與高風險」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"不可接受風險可能被禁止；高風險則需嚴格評估、資料、紀錄、監督與救濟"},{"label":"常見陷阱／為何","text":"風險分級看用途與影響，不是技術名稱；控制強度隨風險提高。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C155","category":"chapters","group":"2.2","title":"2.2｜24｜福利資格與高影響決策","front":"「福利資格與高影響決策」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"直接影響福利取得的AI通常屬高風險，須強化資料品質、可解釋、人工監督與申訴"},{"label":"常見陷阱／為何","text":"對基本生活與權利影響重大時，應避免單一自動決策並提供有效救濟。"}],"sourceSection":"7｜2.2 AI法規與資安風險管理"},{"id":"C156","category":"chapters","group":"2.3","title":"2.3 記憶句","front":"請回想 2.3 的章節記憶句。","fields":[{"label":"記憶句","text":"有揭露、有來源、有授權、有人負責。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C157","category":"chapters","group":"2.3","title":"2.3｜01｜人類最終責任","front":"「人類最終責任」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"公務機關與權責人員仍須為AI輔助的決策、內容與行政結果負責"},{"label":"常見陷阱／為何","text":"AI是工具或系統元件，不能取代法定權限、專業義務與問責。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C158","category":"chapters","group":"2.3","title":"2.3｜02｜公平與社會影響","front":"「公平與社會影響」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"應檢視不同群體、地區與情境的利益與負擔分配，並採取補救"},{"label":"常見陷阱／為何","text":"負責任AI要求持續評估實質影響，不只形式一致。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C159","category":"chapters","group":"2.3","title":"2.3｜03｜在地語言與文化","front":"「在地語言與文化」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"需測試臺灣語言、用語、制度與文化情境，避免錯誤、刻板印象與排除"},{"label":"常見陷阱／為何","text":"在地化需資料、使用者測試與專業覆核，不能只看介面語言。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C160","category":"chapters","group":"2.3","title":"2.3｜04｜AI協作揭露","front":"「AI協作揭露」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"依規範與影響程度說明AI參與範圍、人工覆核及必要限制"},{"label":"常見陷阱／為何","text":"揭露支持透明與信任，但仍要確保品質、權利與責任。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C161","category":"chapters","group":"2.3","title":"2.3｜05｜來源查證與引用倫理","front":"「來源查證與引用倫理」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"引用AI找到的資料時應回到原始來源確認內容、作者、日期與授權"},{"label":"常見陷阱／為何","text":"生成式AI可能混淆或虛構來源；學術與公務使用都應可追溯。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C162","category":"chapters","group":"2.3","title":"2.3｜06｜幻覺的倫理風險","front":"「幻覺的倫理風險」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"流暢錯誤可能誤導民眾、影響權益與信任，須以查證、限制用途和人工覆核處理"},{"label":"常見陷阱／為何","text":"幻覺無法靠單一參數完全消除；應依影響採多層控制。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C163","category":"chapters","group":"2.3","title":"2.3｜07｜資訊過時","front":"「資訊過時」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"模型知識與檢索資料可能落後，應核對生效日期、版本與最新官方公告"},{"label":"常見陷阱／為何","text":"法規、政策與聯絡資訊具高度時效性；版本管理是核心。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C164","category":"chapters","group":"2.3","title":"2.3｜08｜深偽與冒用","front":"「深偽與冒用」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"應驗證來源、脈絡與內容真實性，並處理冒名、詐騙、人格權與公共信任風險"},{"label":"常見陷阱／為何","text":"標示只是控制之一，仍要檢查同意、權利、誤導與損害。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C165","category":"chapters","group":"2.3","title":"2.3｜09｜浮水印與內容憑證","front":"「浮水印與內容憑證」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"可協助辨識來源與編輯歷程，但可能被移除或未被普遍採用，不能單獨證明真偽"},{"label":"常見陷阱／為何","text":"來源標記需搭配簽章、平台資料、原始檔與交叉查證。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C166","category":"chapters","group":"2.3","title":"2.3｜10｜自動化偏誤","front":"「自動化偏誤」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"人可能過度相信AI建議而忽略反證，因此需訓練、界面提示、獨立查核與可拒絕權"},{"label":"常見陷阱／為何","text":"人工在迴路若缺乏能力、資訊或時間，仍可能只是橡皮圖章。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C167","category":"chapters","group":"2.3","title":"2.3｜11｜人格尊嚴與個人自主","front":"「人格尊嚴與個人自主」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"AI應避免操控、羞辱、標籤或不當推論個人，並尊重知情與選擇"},{"label":"常見陷阱／為何","text":"倫理評估超越最低法遵，需看權力不對等、脆弱群體與社會後果。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C168","category":"chapters","group":"2.3","title":"2.3｜12｜肖像與形象利用","front":"「肖像與形象利用」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"使用真人臉孔、聲音或形象生成內容前，應確認同意、授權、用途與不誤導"},{"label":"常見陷阱／為何","text":"著作權外，仍可能涉及人格權、肖像、個資與不正競爭等風險。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C169","category":"chapters","group":"2.3","title":"2.3｜13｜著作保護表達而非思想","front":"「著作保護表達而非思想」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"著作權保護具原創性的表達，不及思想、程序、系統、概念或原理本身"},{"label":"常見陷阱／為何","text":"著作權法第10條之1區分表達與思想；但具體利用仍要看是否重製或改作受保護表達。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C170","category":"chapters","group":"2.3","title":"2.3｜14｜法令與公文非著作權標的","front":"「法令與公文非著作權標的」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"憲法、法律、命令、公文及依法考試試題等依著作權法第9條不得為著作權標的"},{"label":"常見陷阱／為何","text":"第9條有特定範圍；公文包括公務員職務上草擬的文告、講稿、新聞稿等，但仍要注意個資、保密與其他權利。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C171","category":"chapters","group":"2.3","title":"2.3｜15｜著作權自完成時發生","front":"「著作權自完成時發生」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"符合著作要件的創作於完成時享有著作權，原則上不以登記為必要"},{"label":"常見陷阱／為何","text":"臺灣採創作保護原則；權利歸屬與授權仍可能受僱傭或出資契約影響。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C172","category":"chapters","group":"2.3","title":"2.3｜16｜純AI生成與人類創意投入","front":"「純AI生成與人類創意投入」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"完全由AI獨立生成且無人類實際創意投入的內容，原則上無法取得著作權保護"},{"label":"常見陷阱／為何","text":"智慧財產局見解以人類實際創意投入為關鍵；把AI當輔助工具且有人類創作，該人類創作部分可能受保護。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C173","category":"chapters","group":"2.3","title":"2.3｜17｜職務著作","front":"「職務著作」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"受僱人職務上完成著作原則以受僱人為著作人、財產權歸雇用人；契約另有約定者從其約定，公務員亦包含在內"},{"label":"常見陷阱／為何","text":"著作權法第11條可由契約調整著作人與財產權歸屬，考題常測『著作人』與『財產權人』不同。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C174","category":"chapters","group":"2.3","title":"2.3｜18｜出資聘請著作","front":"「出資聘請著作」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"原則以受聘人為著作人；財產權依契約，未約定時歸受聘人，出資人得利用"},{"label":"常見陷阱／為何","text":"著作權法第12條顯示契約的重要性；AI委外案應明確約定成果、資料與再利用。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C175","category":"chapters","group":"2.3","title":"2.3｜19｜翻譯與改作","front":"「翻譯與改作」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"翻譯、改寫等可能屬改作，原則上需確認原著作權利或合理使用依據"},{"label":"常見陷阱／為何","text":"使用AI不改變利用行為的法律性質；權利人、授權範圍與合理使用仍須判斷。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C176","category":"chapters","group":"2.3","title":"2.3｜20｜政府內部重製","front":"「政府內部重製」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"中央或地方機關因立法或行政目的必要，在合理範圍可將他人著作重製為內部參考，但不得不當損害權利人利益"},{"label":"常見陷阱／為何","text":"第44條有目的、必要、合理範圍與不得有害權利人利益等限制，不能概括擴張。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C177","category":"chapters","group":"2.3","title":"2.3｜21｜合理引用","front":"「合理引用」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"為報導、評論、教學、研究或其他正當目的，在必要與合理範圍可引用已公開發表著作"},{"label":"常見陷阱／為何","text":"第52條的引用須有正當目的、已公開、合理範圍與主從關係；並應明示出處。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C178","category":"chapters","group":"2.3","title":"2.3｜22｜明示出處","front":"「明示出處」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"依法合理利用特定著作時，通常仍須以合理方式標示來源與作者"},{"label":"常見陷阱／為何","text":"著作權法第64條要求多種合理利用情形明示出處；學術倫理也要求可追溯。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C179","category":"chapters","group":"2.3","title":"2.3｜23｜合理使用四因素","front":"「合理使用四因素」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"應綜合目的性質、著作性質、利用質量比例及對潛在市場／價值影響判斷"},{"label":"常見陷阱／為何","text":"合理使用沒有單一固定比例或自動安全門檻，須依個案整體衡量。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C180","category":"chapters","group":"2.3","title":"2.3｜24｜實質近似與生成內容","front":"「實質近似與生成內容」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"AI生成結果若與受保護原作在具原創性的表達上實質近似，仍可能侵權"},{"label":"常見陷阱／為何","text":"智慧財產局提醒生成成果仍可能與原作實質近似；使用前應檢查、釐清授權與服務條款。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C181","category":"chapters","group":"2.3","title":"2.3｜25｜授權條款與商業利用","front":"「授權條款與商業利用」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"應確認模型、輸入資料與輸出之授權範圍、轉授權、商用、訓練及責任條款"},{"label":"常見陷阱／為何","text":"工具條款只能處理平台與使用者關係，不能憑空消除第三方權利。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C182","category":"chapters","group":"2.3","title":"2.3｜26｜創用CC授權","front":"「創用CC授權」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"依所選CC條件履行姓名標示、相同方式分享、非商業或禁止改作等要求"},{"label":"常見陷阱／為何","text":"先辨識具體授權標章與版本，再檢查BY、SA、NC、ND及素材來源。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C183","category":"chapters","group":"2.3","title":"2.3｜27｜開源不等於公眾領域","front":"「開源不等於公眾領域」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"開源軟體或模型仍受著作權與授權條款規範，使用者須履行條件"},{"label":"常見陷阱／為何","text":"開源是依授權給予權利，不是無權利；需看署名、衍生、散布、專利與模型資料條款。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C184","category":"chapters","group":"2.3","title":"2.3｜28｜通知取下與網路服務免責","front":"「通知取下與網路服務免責」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"服務提供者須符合政策、通知、移除／阻斷等法定條件，才可能適用責任限制"},{"label":"常見陷阱／為何","text":"著作權法第90條之4至之12設不同服務類型的免責條件，重點是符合程序而非全面免責。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C185","category":"chapters","group":"2.3","title":"2.3｜29｜AI委外契約的權利條款","front":"「AI委外契約的權利條款」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"應明定資料來源、訓練權、輸入輸出權利、第三方侵權、標示、稽核、賠償與交付格式"},{"label":"常見陷阱／為何","text":"AI成果可能涉及多層權利與供應鏈，條款必須具體且可驗證。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C186","category":"chapters","group":"2.3","title":"2.3｜30｜倫理揭露與稽核軌跡","front":"「倫理揭露與稽核軌跡」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"保存AI用途、版本、提示／資料來源、人工修改、核准與發布資訊，依風險適度揭露"},{"label":"常見陷阱／為何","text":"完整而受控的紀錄支援重現、爭議處理、權利證明與改進；公開範圍仍需分級。"}],"sourceSection":"8｜2.3 AI倫理、責任與著作權"},{"id":"C187","category":"law","group":"人工智慧基本法","title":"基本法必背核心","front":"人工智慧基本法最重要的六組條文是哪些？","fields":[{"label":"必背核心","text":"第3條定義；第4條七原則；第5條防免危害；第16條風險分類；第17條高風險責任與救濟；第19條政府風險評估與內控。"}],"sourceSection":"4｜人工智慧基本法20條速覽"},{"id":"C188","category":"law","group":"人工智慧基本法","title":"第1條｜立法目的","front":"第1條「立法目的」的考前一句話是什麼？","fields":[{"label":"考前一句話","text":"促進AI發展與應用、保障人民基本權、增進福祉並兼顧風險治理。"}],"sourceSection":"4｜人工智慧基本法20條速覽"},{"id":"C189","category":"law","group":"人工智慧基本法","title":"第2條｜主管與協調","front":"第2條「主管與協調」的考前一句話是什麼？","fields":[{"label":"考前一句話","text":"中央主管機關與各目的事業主管機關依職掌協力推動。"}],"sourceSection":"4｜人工智慧基本法20條速覽"},{"id":"C190","category":"law","group":"人工智慧基本法","title":"第3條｜AI定義","front":"第3條「AI定義」的考前一句話是什麼？","fields":[{"label":"考前一句話","text":"以數位技術透過模型或演算法展現學習、推論、預測、建議、決策或生成等能力。"}],"sourceSection":"4｜人工智慧基本法20條速覽"},{"id":"C191","category":"law","group":"人工智慧基本法","title":"第4條｜七項原則","front":"第4條「七項原則」的考前一句話是什麼？","fields":[{"label":"考前一句話","text":"永續福祉、人類自主、隱私資料治理、資安安全、透明可解釋、公平不歧視、問責。"}],"sourceSection":"4｜人工智慧基本法20條速覽"},{"id":"C192","category":"law","group":"人工智慧基本法","title":"第5條｜防免危害","front":"第5條「防免危害」的考前一句話是什麼？","fields":[{"label":"考前一句話","text":"避免危害生命、身體、自由、財產、社會秩序與公共利益，並重視兒少保護。"}],"sourceSection":"4｜人工智慧基本法20條速覽"},{"id":"C193","category":"law","group":"人工智慧基本法","title":"第6條｜國家策略協調","front":"第6條「國家策略協調」的考前一句話是什麼？","fields":[{"label":"考前一句話","text":"以國家層級機制統籌AI政策、資源與跨部會治理。"}],"sourceSection":"4｜人工智慧基本法20條速覽"},{"id":"C194","category":"law","group":"人工智慧基本法","title":"第7條｜教育與人才","front":"第7條「教育與人才」的考前一句話是什麼？","fields":[{"label":"考前一句話","text":"推動AI教育、人才培育與全民素養。"}],"sourceSection":"4｜人工智慧基本法20條速覽"},{"id":"C195","category":"law","group":"人工智慧基本法","title":"第8條｜研發與創新","front":"第8條「研發與創新」的考前一句話是什麼？","fields":[{"label":"考前一句話","text":"支持研究、產業創新、基礎建設與負責任發展。"}],"sourceSection":"4｜人工智慧基本法20條速覽"},{"id":"C196","category":"law","group":"人工智慧基本法","title":"第9條｜勞動與社會調適","front":"第9條「勞動與社會調適」的考前一句話是什麼？","fields":[{"label":"考前一句話","text":"關注就業轉型、職能培育與社會影響。"}],"sourceSection":"4｜人工智慧基本法20條速覽"},{"id":"C197","category":"law","group":"人工智慧基本法","title":"第10條｜施政績效","front":"第10條「施政績效」的考前一句話是什麼？","fields":[{"label":"考前一句話","text":"政府持續盤點、評估並揭露AI推動與治理成果。"}],"sourceSection":"4｜人工智慧基本法20條速覽"},{"id":"C198","category":"law","group":"人工智慧基本法","title":"第11條｜國際合作","front":"第11條「國際合作」的考前一句話是什麼？","fields":[{"label":"考前一句話","text":"參與國際規範、技術與治理合作。"}],"sourceSection":"4｜人工智慧基本法20條速覽"},{"id":"C199","category":"law","group":"人工智慧基本法","title":"第12條｜公私協力","front":"第12條「公私協力」的考前一句話是什麼？","fields":[{"label":"考前一句話","text":"鼓勵政府、產業、學研與社會多方協作。"}],"sourceSection":"4｜人工智慧基本法20條速覽"},{"id":"C200","category":"law","group":"人工智慧基本法","title":"第13條｜資料利用","front":"第13條「資料利用」的考前一句話是什麼？","fields":[{"label":"考前一句話","text":"在安全、隱私、文化與智慧財產權前提下促進資料開放、共享與再利用。"}],"sourceSection":"4｜人工智慧基本法20條速覽"},{"id":"C201","category":"law","group":"人工智慧基本法","title":"第14條｜隱私設計","front":"第14條「隱私設計」的考前一句話是什麼？","fields":[{"label":"考前一句話","text":"將隱私保護納入設計與預設設定，落實必要性與最小化。"}],"sourceSection":"4｜人工智慧基本法20條速覽"},{"id":"C202","category":"law","group":"人工智慧基本法","title":"第15條｜法規調適","front":"第15條「法規調適」的考前一句話是什麼？","fields":[{"label":"考前一句話","text":"檢討既有法規與監理工具，使創新與權利保障並行。"}],"sourceSection":"4｜人工智慧基本法20條速覽"},{"id":"C203","category":"law","group":"人工智慧基本法","title":"第16條｜風險分類","front":"第16條「風險分類」的考前一句話是什麼？","fields":[{"label":"考前一句話","text":"參照國際作法依用途與影響建立風險分類與差異化治理。"}],"sourceSection":"4｜人工智慧基本法20條速覽"},{"id":"C204","category":"law","group":"人工智慧基本法","title":"第17條｜高風險責任","front":"第17條「高風險責任」的考前一句話是什麼？","fields":[{"label":"考前一句話","text":"強化責任分配、救濟、損害填補與必要保險。"}],"sourceSection":"4｜人工智慧基本法20條速覽"},{"id":"C205","category":"law","group":"人工智慧基本法","title":"第18條｜驗證與標準","front":"第18條「驗證與標準」的考前一句話是什麼？","fields":[{"label":"考前一句話","text":"推動評測、驗證、標準與信任機制。"}],"sourceSection":"4｜人工智慧基本法20條速覽"},{"id":"C206","category":"law","group":"人工智慧基本法","title":"第19條｜政府使用AI","front":"第19條「政府使用AI」的考前一句話是什麼？","fields":[{"label":"考前一句話","text":"政府應辦理風險評估並建立使用規範、內控及監督。"}],"sourceSection":"4｜人工智慧基本法20條速覽"},{"id":"C207","category":"law","group":"人工智慧基本法","title":"第20條｜施行","front":"第20條「施行」的考前一句話是什麼？","fields":[{"label":"考前一句話","text":"規定法律施行安排。"}],"sourceSection":"4｜人工智慧基本法20條速覽"},{"id":"C208","category":"law","group":"生成式AI十點指引","title":"第1點｜先理解目的與風險","front":"第1點「先理解目的與風險」的作答關鍵是什麼？","fields":[{"label":"作答關鍵","text":"生成式AI可增進效率，但伴隨幻覺、偏誤、資安、個資與權利風險。"}],"sourceSection":"5｜公務機關使用生成式AI十點指引"},{"id":"C209","category":"law","group":"生成式AI十點指引","title":"第2點｜人類為主","front":"第2點「人類為主」的作答關鍵是什麼？","fields":[{"label":"作答關鍵","text":"維持人類最終目的與專業判斷，不取代自主、創造力與人際互動。"}],"sourceSection":"5｜公務機關使用生成式AI十點指引"},{"id":"C210","category":"law","group":"生成式AI十點指引","title":"第3點｜秘密文書禁用","front":"第3點「秘密文書禁用」的作答關鍵是什麼？","fields":[{"label":"作答關鍵","text":"秘密文書應由承辦人撰寫，不得使用生成式AI。"}],"sourceSection":"5｜公務機關使用生成式AI十點指引"},{"id":"C211","category":"law","group":"生成式AI十點指引","title":"第4點｜敏感資料不得外送","front":"第4點「敏感資料不得外送」的作答關鍵是什麼？","fields":[{"label":"作答關鍵","text":"不得輸入機密、個資、未公開資訊或提出相關問題；封閉環境亦須先確認安全與分級。"}],"sourceSection":"5｜公務機關使用生成式AI十點指引"},{"id":"C212","category":"law","group":"生成式AI十點指引","title":"第5點｜不得完全信任","front":"第5點「不得完全信任」的作答關鍵是什麼？","fields":[{"label":"作答關鍵","text":"輸出須查證，不得直接作成行政行為或作為唯一依據。"}],"sourceSection":"5｜公務機關使用生成式AI十點指引"},{"id":"C213","category":"law","group":"生成式AI十點指引","title":"第6點｜適度揭露","front":"第6點「適度揭露」的作答關鍵是什麼？","fields":[{"label":"作答關鍵","text":"依使用情境與影響適當揭露AI參與。"}],"sourceSection":"5｜公務機關使用生成式AI十點指引"},{"id":"C214","category":"law","group":"生成式AI十點指引","title":"第7點｜遵守法規與內控","front":"第7點「遵守法規與內控」的作答關鍵是什麼？","fields":[{"label":"作答關鍵","text":"遵守資安、個資、著作權及資訊規範；機關可訂更具體控制。"}],"sourceSection":"5｜公務機關使用生成式AI十點指引"},{"id":"C215","category":"law","group":"生成式AI十點指引","title":"第8點｜廠商同樣受約束","front":"第8點「廠商同樣受約束」的作答關鍵是什麼？","fields":[{"label":"作答關鍵","text":"契約應要求委外廠商遵守指引與機關規範。"}],"sourceSection":"5｜公務機關使用生成式AI十點指引"},{"id":"C216","category":"law","group":"生成式AI十點指引","title":"第9點｜準用對象","front":"第9點「準用對象」的作答關鍵是什麼？","fields":[{"label":"作答關鍵","text":"公營事業、學校、行政法人與政府捐助財團法人等可準用。"}],"sourceSection":"5｜公務機關使用生成式AI十點指引"},{"id":"C217","category":"law","group":"生成式AI十點指引","title":"第10點｜其他機關參考","front":"第10點「其他機關參考」的作答關鍵是什麼？","fields":[{"label":"作答關鍵","text":"行政院以外機關可參考並依權責制定規範。"}],"sourceSection":"5｜公務機關使用生成式AI十點指引"},{"id":"C218","category":"law","group":"生命週期與驗收","title":"立案與問題定義","front":"「立案與問題定義」階段必須完成哪些治理？","fields":[{"label":"必做治理","text":"需求、公共價值、利害關係人、風險初評、資料與資源可行性。"}],"sourceSection":"6｜公部門AI生命週期、資料品質與驗收"},{"id":"C219","category":"law","group":"生命週期與驗收","title":"資料探索與模型開發","front":"「資料探索與模型開發」階段必須完成哪些治理？","fields":[{"label":"必做治理","text":"資料法源與品質、代表性、標註、模型／工具選型、版本與實驗紀錄。"}],"sourceSection":"6｜公部門AI生命週期、資料品質與驗收"},{"id":"C220","category":"law","group":"生命週期與驗收","title":"驗證、部署與試辦","front":"「驗證、部署與試辦」階段必須完成哪些治理？","fields":[{"label":"必做治理","text":"技術指標、系統穩定、UX、無障礙、公平、資安、人工接管與驗收。"}],"sourceSection":"6｜公部門AI生命週期、資料品質與驗收"},{"id":"C221","category":"law","group":"生命週期與驗收","title":"營運監測與退場","front":"「營運監測與退場」階段必須完成哪些治理？","fields":[{"label":"必做治理","text":"漂移、事故、群體差異、成本、供應商變更、重訓／停用、資料與紀錄處置。"}],"sourceSection":"6｜公部門AI生命週期、資料品質與驗收"},{"id":"C222","category":"law","group":"生命週期與驗收","title":"資料品質四面向","front":"請回想「資料品質四面向」的完整考點。","fields":[{"label":"考前重點","text":"資料品質四面向：完整性（有沒有缺）｜正確性（值是否對）｜真實性／可信度（來源是否可信）｜時效性（是否夠新）。"}],"sourceSection":"6｜公部門AI生命週期、資料品質與驗收"},{"id":"C223","category":"law","group":"生命週期與驗收","title":"AI系統驗收","front":"請回想「AI系統驗收」的完整考點。","fields":[{"label":"考前重點","text":"驗收不能只看模型分數：還要看系統穩定與反應時間、使用者體驗與無障礙、公平性、文件／程式／中繼資料完整、資安與人工接管。"}],"sourceSection":"6｜公部門AI生命週期、資料品質與驗收"},{"id":"C224","category":"law","group":"AI風險分級","title":"不可接受／禁止","front":"「不可接受／禁止」應如何一眼辨識？","fields":[{"label":"判斷與控制","text":"操控、侵害基本權或造成不可接受危害的用途；原則上禁止或不得部署。"}],"sourceSection":"7｜AI風險分級與評測十面向"},{"id":"C225","category":"law","group":"AI風險分級","title":"高風險","front":"「高風險」應如何一眼辨識？","fields":[{"label":"判斷與控制","text":"關鍵基礎設施、生物辨識、教育／就業、信用／福利、執法、邊境、司法／民主等重大影響。"}],"sourceSection":"7｜AI風險分級與評測十面向"},{"id":"C226","category":"law","group":"AI風險分級","title":"有限風險","front":"「有限風險」應如何一眼辨識？","fields":[{"label":"判斷與控制","text":"聊天機器人、情緒或生物分類、深偽／合成內容等，重點常在透明與告知。"}],"sourceSection":"7｜AI風險分級與評測十面向"},{"id":"C227","category":"law","group":"AI風險分級","title":"低風險","front":"「低風險」應如何一眼辨識？","fields":[{"label":"判斷與控制","text":"遊戲、垃圾郵件過濾等；仍需基本安全、法遵與品質管理。"}],"sourceSection":"7｜AI風險分級與評測十面向"},{"id":"C228","category":"law","group":"評測十面向","title":"安全性","front":"「安全性」應如何一眼辨識？","fields":[{"label":"一眼辨識","text":"避免正常與可預見誤用造成傷害"}],"sourceSection":"7｜AI風險分級與評測十面向"},{"id":"C229","category":"law","group":"評測十面向","title":"可解釋性","front":"「可解釋性」應如何一眼辨識？","fields":[{"label":"一眼辨識","text":"能以適當方式說明主要因素、限制與結果"}],"sourceSection":"7｜AI風險分級與評測十面向"},{"id":"C230","category":"law","group":"評測十面向","title":"韌性","front":"「韌性」應如何一眼辨識？","fields":[{"label":"一眼辨識","text":"面對擾動、攻擊或環境變化仍能維持／恢復"}],"sourceSection":"7｜AI風險分級與評測十面向"},{"id":"C231","category":"law","group":"評測十面向","title":"公平性","front":"「公平性」應如何一眼辨識？","fields":[{"label":"一眼辨識","text":"避免不合理群體差異與歧視"}],"sourceSection":"7｜AI風險分級與評測十面向"},{"id":"C232","category":"law","group":"評測十面向","title":"準確性","front":"「準確性」應如何一眼辨識？","fields":[{"label":"一眼辨識","text":"輸出與真值或規格的接近程度"}],"sourceSection":"7｜AI風險分級與評測十面向"},{"id":"C233","category":"law","group":"評測十面向","title":"透明性","front":"「透明性」應如何一眼辨識？","fields":[{"label":"一眼辨識","text":"揭露AI使用、能力、限制與重要資訊"}],"sourceSection":"7｜AI風險分級與評測十面向"},{"id":"C234","category":"law","group":"評測十面向","title":"問責性","front":"「問責性」應如何一眼辨識？","fields":[{"label":"一眼辨識","text":"責任角色、紀錄、監督與救濟清楚"}],"sourceSection":"7｜AI風險分級與評測十面向"},{"id":"C235","category":"law","group":"評測十面向","title":"可靠性","front":"「可靠性」應如何一眼辨識？","fields":[{"label":"一眼辨識","text":"在既定條件與時間下穩定符合要求"}],"sourceSection":"7｜AI風險分級與評測十面向"},{"id":"C236","category":"law","group":"評測十面向","title":"隱私性","front":"「隱私性」應如何一眼辨識？","fields":[{"label":"一眼辨識","text":"合法、必要、最小化並保護個人資料"}],"sourceSection":"7｜AI風險分級與評測十面向"},{"id":"C237","category":"law","group":"評測十面向","title":"資安性","front":"「資安性」應如何一眼辨識？","fields":[{"label":"一眼辨識","text":"防止未授權存取、竄改、洩漏與攻擊"}],"sourceSection":"7｜AI風險分級與評測十面向"},{"id":"C238","category":"law","group":"著作權","title":"著作權四步拆題","front":"遇到著作權題時，依哪四步拆解？","fields":[{"label":"四步拆題","text":"①是否為受保護著作／人類創作？②誰是著作人與財產權人？③行為是重製、改作、公開傳輸或其他利用？④是否有授權或合理使用依據？"}],"sourceSection":"8｜著作權與生成式AI高頻考點"},{"id":"C239","category":"law","group":"著作權","title":"§3","front":"「§3」的考前定位是什麼？","fields":[{"label":"考前定位","text":"著作、著作人、重製、改作等定義；AI不因工具名稱改變利用行為性質。"}],"sourceSection":"8｜著作權與生成式AI高頻考點"},{"id":"C240","category":"law","group":"著作權","title":"§9","front":"「§9」的考前定位是什麼？","fields":[{"label":"考前定位","text":"法令、公文、通用符號／表格、依法考試試題等不得為著作權標的。"}],"sourceSection":"8｜著作權與生成式AI高頻考點"},{"id":"C241","category":"law","group":"著作權","title":"§10、§10-1","front":"「§10、§10-1」的考前定位是什麼？","fields":[{"label":"考前定位","text":"著作完成時享有權利；保護表達，不及思想、程序、系統與概念。"}],"sourceSection":"8｜著作權與生成式AI高頻考點"},{"id":"C242","category":"law","group":"著作權","title":"§11","front":"「§11」的考前定位是什麼？","fields":[{"label":"考前定位","text":"職務著作：著作人與財產權可依契約；受僱人包括公務員。"}],"sourceSection":"8｜著作權與生成式AI高頻考點"},{"id":"C243","category":"law","group":"著作權","title":"§12","front":"「§12」的考前定位是什麼？","fields":[{"label":"考前定位","text":"出資聘請：原則受聘人為著作人，財產權依契約；未約定多歸受聘人。"}],"sourceSection":"8｜著作權與生成式AI高頻考點"},{"id":"C244","category":"law","group":"著作權","title":"§44","front":"「§44」的考前定位是什麼？","fields":[{"label":"考前定位","text":"政府因立法／行政必要得在合理範圍重製作內部參考，不得不當損害權利人。"}],"sourceSection":"8｜著作權與生成式AI高頻考點"},{"id":"C245","category":"law","group":"著作權","title":"§52、§64","front":"「§52、§64」的考前定位是什麼？","fields":[{"label":"考前定位","text":"正當目的可在合理範圍引用已公開著作，並應合理明示出處。"}],"sourceSection":"8｜著作權與生成式AI高頻考點"},{"id":"C246","category":"law","group":"著作權","title":"§65","front":"「§65」的考前定位是什麼？","fields":[{"label":"考前定位","text":"合理使用四因素：目的性質、著作性質、質量比例、對市場／價值影響。"}],"sourceSection":"8｜著作權與生成式AI高頻考點"},{"id":"C247","category":"law","group":"著作權","title":"§90-4～§90-12","front":"「§90-4～§90-12」的考前定位是什麼？","fields":[{"label":"考前定位","text":"網路服務提供者免責須符合政策、通知、移除／阻斷與回復等法定程序。"}],"sourceSection":"8｜著作權與生成式AI高頻考點"},{"id":"C248","category":"law","group":"著作權","title":"純AI生成","front":"請說明「純AI生成」的完整判斷。","fields":[{"label":"完整判斷","text":"純AI生成：若無人類實際創意投入，AI本身不能成為著作人；若人類把AI作為輔助工具並有實際創作，該創意部分可能受保護。"}],"sourceSection":"8｜著作權與生成式AI高頻考點"},{"id":"C249","category":"law","group":"著作權","title":"生成結果侵權","front":"請說明「生成結果侵權」的完整判斷。","fields":[{"label":"完整判斷","text":"生成結果侵權：即使輸出本身不受保護，若與他人原作具原創性的表達實質近似，商業利用仍可能侵權。"}],"sourceSection":"8｜著作權與生成式AI高頻考點"},{"id":"C250","category":"law","group":"著作權","title":"委外／採購","front":"請說明「委外／採購」的完整判斷。","fields":[{"label":"完整判斷","text":"委外／採購：『成果歸機關』過度籠統；應約定資料、提示、模型、輸出、開源元件、第三方權利、商用與再訓練。"}],"sourceSection":"8｜著作權與生成式AI高頻考點"},{"id":"C251","category":"sample","group":"官方樣題觀察","title":"1.1 樣題包裝","front":"1.1 官方樣題常用哪些情境包裝？","fields":[{"label":"常見包裝","text":"LMM／LLM、Human-in-the-loop、生成與判別、說謊者紅利、數位包容、Agentic AI、基本法人類自主。"}],"sourceSection":"9｜50題官方樣題的命題觀察"},{"id":"C252","category":"sample","group":"官方樣題觀察","title":"1.2 樣題包裝","front":"1.2 官方樣題常用哪些情境包裝？","fields":[{"label":"常見包裝","text":"提示定義、步驟化、商業洞察、法律查證、代理覆核、公文不得完全自動化。"}],"sourceSection":"9｜50題官方樣題的命題觀察"},{"id":"C253","category":"sample","group":"官方樣題觀察","title":"1.3 樣題包裝","front":"1.3 官方樣題常用哪些情境包裝？","fields":[{"label":"常見包裝","text":"FinTech限制、製造生成應用、Edge AI、延遲／成本、可解釋與信任、工作流、未公開草案。"}],"sourceSection":"9｜50題官方樣題的命題觀察"},{"id":"C254","category":"sample","group":"官方樣題觀察","title":"2.1 樣題包裝","front":"2.1 官方樣題常用哪些情境包裝？","fields":[{"label":"常見包裝","text":"可追溯／資料血緣、資料主權、個資、透明、臺灣語料與著作權、最小化、生命週期、漂移、群體差異。"}],"sourceSection":"9｜50題官方樣題的命題觀察"},{"id":"C255","category":"sample","group":"官方樣題觀察","title":"2.2 樣題包裝","front":"2.2 官方樣題常用哪些情境包裝？","fields":[{"label":"常見包裝","text":"通知取下、ISO 42001、對抗攻擊、高風險、個資外洩、存取日誌、福利決策。"}],"sourceSection":"9｜50題官方樣題的命題觀察"},{"id":"C256","category":"sample","group":"官方樣題觀察","title":"2.3 樣題包裝","front":"2.3 官方樣題常用哪些情境包裝？","fields":[{"label":"常見包裝","text":"司法與人類責任、AI著作人、倫理治理、安全港、商用內容、可信賴AI、授權與揭露。"}],"sourceSection":"9｜50題官方樣題的命題觀察"},{"id":"C257","category":"sample","group":"官方樣題觀察","title":"解題共通訊號","front":"官方樣題的正確選項通常具備哪些共同訊號？","fields":[{"label":"共通訊號","text":"正確選項通常不會承諾『完全自動、永遠正確、零風險、只要揭露即可』；會保留風險相稱、人工判斷、可查證、可追溯與救濟。"}],"sourceSection":"9｜50題官方樣題的命題觀察"}]};</script>
  <script>
  (function(){
    'use strict';
    var KEY='gov-ai-review-23p-v1';
    var saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(error){}
    var state={mode:saved.mode||'cards',group:saved.group||'all',status:saved.status||'all',order:saved.order||'sequential',cursor:0,revealed:false,mastery:saved.mastery||{},readingIndex:saved.readingIndex||0};
    var queue=[],toastTimer=null;
    var cardById={};DATA.cards.forEach(function(item){cardById[item.id]=item});
    var esc=function(value){return String(value==null?'':value).replace(/[&<>\"]/g,function(char){return{'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[char]})};
    function save(){localStorage.setItem(KEY,JSON.stringify({mode:state.mode,group:state.group,status:state.status,order:state.order,mastery:state.mastery,readingIndex:state.readingIndex}))}
    function toast(message){var element=document.getElementById('toast');element.textContent=message;element.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){element.classList.remove('show')},1600)}
    function shuffle(items){var copy=items.slice();for(var i=copy.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var temp=copy[i];copy[i]=copy[j];copy[j]=temp}return copy}
    function modeCards(){if(state.mode==='sprint')return DATA.cards.filter(function(item){return item.category==='sprint'});if(state.mode==='chapters')return DATA.cards.filter(function(item){return item.category==='chapters'});if(state.mode==='law')return DATA.cards.filter(function(item){return item.category==='law'});return DATA.cards}
    function statusMatch(card){var value=state.mastery[card.id];if(state.status==='unseen')return value==null;if(state.status==='review')return value===0||value===1;if(state.status==='mastered')return value===2;return true}
    function filtered(){var items=modeCards().filter(function(card){if(state.group!=='all'&&card.group!==state.group)return false;return statusMatch(card)});return state.order==='random'?shuffle(items):items}
    function rebuild(keep){var current=keep&&queue[state.cursor]?queue[state.cursor].id:null;queue=filtered();state.cursor=current?queue.findIndex(function(card){return card.id===current}):0;if(state.cursor<0)state.cursor=0;state.revealed=false}
    function preserveContentViewport(renderFn){
      var anchor=document.getElementById('contentViewportAnchor'),before=anchor?anchor.getBoundingClientRect().top:null;
      renderFn();
      requestAnimationFrame(function(){var next=document.getElementById('contentViewportAnchor');if(before!==null&&next){var delta=next.getBoundingClientRect().top-before;if(Math.abs(delta)>.5)window.scrollBy(0,delta)}requestAnimationFrame(function(){var title=document.querySelector('#card .card-title, #card .reading-head h2');if(!title)return;var rect=title.getBoundingClientRect(),safeTop=window.matchMedia('(max-width: 900px)').matches?64:145;if(rect.bottom<safeTop+38||rect.top>window.innerHeight-125)window.scrollBy(0,rect.top-safeTop)})})
    }
    function statusLabel(id){var value=state.mastery[id];return value===2?['已熟悉','mastered']:value===1?['模糊','review']:value===0?['不熟','review']:['未複習','unseen']}
    function statsHtml(){var values=Object.values(state.mastery),mastered=values.filter(function(v){return v===2}).length,review=values.filter(function(v){return v===0||v===1}).length,seen=values.length,pct=Math.round(mastered/DATA.cards.length*100);var cards=[['考點卡總數',DATA.cards.length+' 張','由23頁講義重組'],['已複習',seen+' 張','本機自動保存'],['待加強',review+' 張','不熟＋模糊'],['熟悉進度',pct+'%',mastered+' 張已熟悉']];return cards.map(function(item){return '<div class="stat"><div class="stat-label">'+item[0]+'</div><div class="stat-value">'+item[1]+'</div><div class="stat-note">'+item[2]+'</div></div>'}).join('')}
    function groupOptions(){var groups=Array.from(new Set(modeCards().map(function(item){return item.group})));return groups.map(function(group){return '<option value="'+esc(group)+'">'+esc(group)+'</option>'}).join('')}
    function progressRows(){var groups=['1.1','1.2','1.3','2.1','2.2','2.3','人工智慧基本法','生成式AI十點指引'];return groups.map(function(group){var items=DATA.cards.filter(function(card){return card.group===group}),done=items.filter(function(card){return state.mastery[card.id]===2}).length,pct=items.length?Math.round(done/items.length*100):0;return '<div class="mini"><div class="mini-label"><span>'+esc(group)+'</span><b>'+done+'/'+items.length+'</b></div><div class="track"><div class="fill" style="width:'+pct+'%"></div></div></div>'}).join('')}
    function filterHtml(prefix){if(state.mode==='resources')return '<div class="panel"><div class="panel-head"><strong>學習資源索引</strong><span class="tag">21 項</span></div><div class="progress-list"><h3>使用方式</h3><p style="margin:0;color:#617785;font-size:13px">依次層面查看官方課程、指引、法規與學習路徑；連結將在新分頁開啟。</p></div></div>';if(state.mode==='reading'){var options=DATA.sections.map(function(section,index){return '<option value="'+index+'">'+esc(section.title)+'</option>'}).join('');return '<div class="panel"><div class="panel-head"><strong>講義章節</strong><span class="tag">'+DATA.sourcePages+' 頁來源</span></div><div class="filter-body"><div class="field"><label for="'+prefix+'Reading">選擇章節</label><select id="'+prefix+'Reading">'+options+'</select></div></div><div class="progress-list"><h3>閱讀方式</h3><p style="margin:0;color:#617785;font-size:13px">每次只顯示一章；使用上一章／下一章切換，畫面會維持在講義內容區。</p></div></div>'}return '<div class="panel"><div class="panel-head"><strong>背誦篩選</strong><span class="tag">目前 '+queue.length+' 張</span></div><div class="filter-body"><div class="field"><label for="'+prefix+'Group">考點群組</label><select id="'+prefix+'Group"><option value="all">全部群組</option>'+groupOptions()+'</select></div><div class="field"><label for="'+prefix+'Status">熟悉度</label><select id="'+prefix+'Status"><option value="all">全部狀態</option><option value="unseen">尚未複習</option><option value="review">不熟或模糊</option><option value="mastered">已熟悉</option></select></div><div class="checkrow"><span>隨機順序</span><button class="toggle '+(state.order==='random'?'on':'')+'" id="'+prefix+'Order" role="switch" aria-checked="'+(state.order==='random')+'"></button></div></div><div class="progress-list"><h3>重點群組熟悉度</h3>'+progressRows()+'</div><button class="reset-btn" id="'+prefix+'Reset">重設全部背誦進度</button></div>'}
    function wireFilter(root,prefix){var reading=root.querySelector('#'+prefix+'Reading');if(reading){reading.value=String(state.readingIndex);reading.onchange=function(){state.readingIndex=Number(this.value);save();preserveContentViewport(renderReading);renderFilters()};return}var group=root.querySelector('#'+prefix+'Group'),status=root.querySelector('#'+prefix+'Status'),order=root.querySelector('#'+prefix+'Order'),reset=root.querySelector('#'+prefix+'Reset');if(!group)return;group.value=Array.from(group.options).some(function(option){return option.value===state.group})?state.group:'all';status.value=state.status;group.onchange=function(){state.group=this.value;save();rebuild(false);renderAll()};status.onchange=function(){state.status=this.value;save();rebuild(false);renderAll()};order.onclick=function(){state.order=state.order==='random'?'sequential':'random';save();rebuild(false);renderAll();toast(state.order==='random'?'已切換為隨機順序':'已切換為原始順序')};reset.onclick=function(){if(!confirm('確定清除所有熟悉度標記？'))return;state.mastery={};save();renderAll();toast('背誦進度已重設')}}
    function renderFilters(){var desktop=document.getElementById('desktopSidebar'),mobile=document.getElementById('mobileFilterBody');desktop.innerHTML=filterHtml('d');mobile.innerHTML=filterHtml('m');wireFilter(desktop,'d');wireFilter(mobile,'m')}
    function renderStats(){document.getElementById('stats').innerHTML=statsHtml()}
    function emptyHtml(){return '<div class="empty"><div><h2>目前沒有符合條件的考點</h2><p>請調整熟悉度或群組篩選，或切換回全部考點卡。</p><button class="primary" id="clearFilter">清除篩選</button></div></div>'}
    function answerHtml(card){return '<div class="answer">'+card.fields.map(function(field){var trap=/陷阱/.test(field.label);return '<section class="answer-field '+(trap?'trap':'')+'"><strong>'+esc(field.label)+'</strong><p>'+esc(field.text)+'</p></section>'}).join('')+'<div class="mastery"><button class="m0 '+(state.mastery[card.id]===0?'active':'')+'" data-rate="0">1｜不熟</button><button class="m1 '+(state.mastery[card.id]===1?'active':'')+'" data-rate="1">2｜模糊</button><button class="m2 '+(state.mastery[card.id]===2?'active':'')+'" data-rate="2">3｜熟悉</button></div></div>'}
    function renderCard(){var element=document.getElementById('card');if(!queue.length){element.innerHTML=emptyHtml();document.getElementById('clearFilter').onclick=function(){state.group='all';state.status='all';rebuild(false);renderAll()};return}var card=queue[state.cursor],status=statusLabel(card.id),pct=Math.round((state.cursor+1)/queue.length*100);element.innerHTML='<div class="progress-strip"><span style="width:'+pct+'%"></span></div><div class="card-top"><div class="eyebrow"><span class="tag section">'+esc(card.group)+'</span><span class="tag '+status[1]+'">'+status[0]+'</span><span class="tag">'+esc(card.sourceSection)+'</span></div></div><div class="card-body"><div class="counter"><b>'+card.id+'</b><span>第 '+(state.cursor+1)+'／'+queue.length+' 張</span></div><h2 class="card-title">'+esc(card.title)+'</h2><div class="prompt-box"><div><p>'+esc(card.front)+'</p><button class="primary" id="revealBtn">'+(state.revealed?'遮住答案':'顯示答案')+'</button></div></div>'+(state.revealed?answerHtml(card):'')+'</div><div class="card-actions"><button class="secondary" id="prevBtn" '+(state.cursor===0?'disabled':'')+'>← 上一個</button><span class="shortcut">空白鍵揭曉・1/2/3標記・← → 切換</span><div class="action-group"><button class="secondary" id="toggleBtn">'+(state.revealed?'遮住':'揭曉')+'</button><button class="primary" id="nextBtn">'+(state.cursor===queue.length-1?'回到第一個':'下一個 →')+'</button></div></div>';document.getElementById('revealBtn').onclick=toggleReveal;document.getElementById('toggleBtn').onclick=toggleReveal;document.getElementById('prevBtn').onclick=previousCard;document.getElementById('nextBtn').onclick=nextCard;element.querySelectorAll('[data-rate]').forEach(function(button){button.onclick=function(){rate(Number(this.dataset.rate))}})}
    function toggleReveal(){state.revealed=!state.revealed;renderCard()}
    function rate(value){var card=queue[state.cursor];state.mastery[card.id]=value;save();renderCard();renderStats();renderFilters();toast(value===2?'已標記為熟悉':value===1?'已標記為模糊':'已列入不熟考點')}
    function nextCard(){if(!queue.length)return;state.cursor=(state.cursor+1)%queue.length;state.revealed=false;preserveContentViewport(renderCard)}
    function previousCard(){if(state.cursor<=0)return;state.cursor--;state.revealed=false;preserveContentViewport(renderCard)}
    function renderLinks(cell){return (cell.links||[]).map(function(link){return '<a class="cell-link" href="'+esc(link.url)+'" target="_blank" rel="noopener">'+esc(link.text||'開啟來源')+' ↗</a>'}).join('')}
    function tableHtml(block){if(block.rows.length===1&&block.rows[0].length===1)return '<div class="callout">'+esc(block.rows[0][0].text)+renderLinks(block.rows[0][0])+'</div>';var headers=block.rows[0];return '<div class="table-wrap"><table class="data-table"><thead><tr>'+headers.map(function(cell){return '<th>'+esc(cell.text)+'</th>'}).join('')+'</tr></thead><tbody>'+block.rows.slice(1).map(function(row){return '<tr>'+row.map(function(cell,index){return '<td data-label="'+esc(headers[index]?headers[index].text:'')+'">'+esc(cell.text)+renderLinks(cell)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
    function blockHtml(block){if(block.type==='subheading')return '<h3>'+esc(block.text)+'</h3>';if(block.type==='paragraph')return '<p>'+esc(block.text)+'</p>';if(block.type==='bullet')return '<ul><li>'+esc(block.text)+'</li></ul>';if(block.type==='table')return tableHtml(block);return ''}
    function renderReading(){var section=DATA.sections[state.readingIndex]||DATA.sections[0],element=document.getElementById('card'),pct=Math.round((state.readingIndex+1)/DATA.sections.length*100);element.innerHTML='<div class="progress-strip"><span style="width:'+pct+'%"></span></div><div class="reading-head"><span class="tag section">完整講義｜第 '+(state.readingIndex+1)+'／'+DATA.sections.length+' 章</span><h2>'+esc(section.title)+'</h2></div><div class="reading-body">'+section.blocks.map(blockHtml).join('')+'</div><div class="card-actions"><button class="secondary" id="readPrev" '+(state.readingIndex===0?'disabled':'')+'>← 上一章</button><span class="shortcut">切換章節時維持在講義內容區</span><button class="primary" id="readNext">'+(state.readingIndex===DATA.sections.length-1?'回到第一章':'下一章 →')+'</button></div>';document.getElementById('readPrev').onclick=function(){if(state.readingIndex>0){state.readingIndex--;save();preserveContentViewport(renderReading);renderFilters()}};document.getElementById('readNext').onclick=function(){state.readingIndex=(state.readingIndex+1)%DATA.sections.length;save();preserveContentViewport(renderReading);renderFilters()}}
    function renderResources(){var section=DATA.sections.find(function(item){return item.title.includes('21項官方學習資源')}),table=section.blocks.find(function(block){return block.type==='table'}),rows=table.rows.slice(1);document.getElementById('card').innerHTML='<div class="reading-head"><span class="tag section">官方學習資源</span><h2>21項官方學習資源完整索引</h2></div><div class="reading-body"><div class="resource-grid">'+rows.map(function(row){var link=(row[4].links||[])[0];return '<article class="resource"><div class="resource-meta"><span class="tag">'+esc(row[1].text)+'</span><span class="tag">'+esc(row[3].text)+'</span></div><h3>'+esc(row[0].text)+'｜'+esc(row[2].text)+'</h3><p>'+esc(row[4].text.replace(/\s*開啟來源\s*$/,''))+'</p>'+(link?'<a href="'+esc(link.url)+'" target="_blank" rel="noopener">開啟來源 ↗</a>':'')+'</article>'}).join('')+'</div></div>'}
    function setMode(mode){state.mode=mode;state.group='all';state.status='all';state.cursor=0;state.revealed=false;save();if(mode==='reading')state.readingIndex=Math.min(state.readingIndex,DATA.sections.length-1);else if(mode!=='resources')rebuild(false);preserveContentViewport(renderPrimary);renderFilters();document.querySelectorAll('.mode-btn').forEach(function(button){button.classList.toggle('active',button.dataset.mode===mode)})}
    function renderPrimary(){if(state.mode==='reading')renderReading();else if(state.mode==='resources')renderResources();else renderCard()}
    function renderAll(){renderStats();renderFilters();renderPrimary();document.querySelectorAll('.mode-btn').forEach(function(button){button.classList.toggle('active',button.dataset.mode===state.mode)})}
    document.querySelectorAll('.mode-btn').forEach(function(button){button.onclick=function(){setMode(this.dataset.mode)}});
    document.addEventListener('keydown',function(event){if(['INPUT','SELECT','TEXTAREA'].indexOf(document.activeElement.tagName)>=0)return;if(state.mode==='reading'||state.mode==='resources')return;if(event.key==='ArrowRight')nextCard();else if(event.key==='ArrowLeft')previousCard();else if(event.key===' '||event.key==='Enter'){event.preventDefault();toggleReveal()}else if(/[1-3]/.test(event.key)&&state.revealed)rate(Number(event.key)-1)});
    document.getElementById('cardCountBadge').textContent=DATA.cards.length+'張考點卡';
    if(['cards','sprint','chapters','law','reading','resources'].indexOf(state.mode)<0)state.mode='cards';
    if(state.mode!=='reading'&&state.mode!=='resources')rebuild(false);renderAll()
  })();
  </script>
</body>
</html>
