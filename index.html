  <script>const DATA={"title":"公務 AI 共通核心能力認證｜考前重點回顧","sourcePages":23,"sourceCutoff":"2026-08-27","sections":[{"title":"1｜考試藍圖與出題結構","blocks":[{"type":"table","rows":[[{"text":"考制｜60分鐘、50題單選、70分及格。換算為至少答對35題；建議把安全目標設在40題以上。","links":[]}]]},{"type":"table","rows":[[{"text":"次層面","links":[]},{"text":"名稱","links":[]},{"text":"樣題題數","links":[]},{"text":"占比","links":[]},{"text":"複習定位","links":[]}],[{"text":"1.1","links":[]},{"text":"AI基礎概念與社會影響","links":[]},{"text":"7","links":[]},{"text":"14%","links":[]},{"text":"基礎應用","links":[]}],[{"text":"1.2","links":[]},{"text":"生成式AI與人機互動","links":[]},{"text":"7","links":[]},{"text":"14%","links":[]},{"text":"基礎應用","links":[]}],[{"text":"1.3","links":[]},{"text":"AI應用與公共服務轉型策略","links":[]},{"text":"8","links":[]},{"text":"16%","links":[]},{"text":"基礎應用","links":[]}],[{"text":"2.1","links":[]},{"text":"AI政策與治理指引","links":[]},{"text":"10","links":[]},{"text":"20%","links":[]},{"text":"治理高權重","links":[]}],[{"text":"2.2","links":[]},{"text":"AI法規與資安風險管理","links":[]},{"text":"8","links":[]},{"text":"16%","links":[]},{"text":"治理高權重","links":[]}],[{"text":"2.3","links":[]},{"text":"AI倫理、責任與著作權","links":[]},{"text":"10","links":[]},{"text":"20%","links":[]},{"text":"治理高權重","links":[]}]]},{"type":"paragraph","text":"樣題分布顯示第二大層面（2.1～2.3）共28題，占56%；其中2.1與2.3各10題，法規情境、風險治理與著作權不可只做表面背誦。","links":[]}]},{"title":"2｜30個最後衝刺重點","blocks":[{"type":"table","rows":[[{"text":"序","links":[]},{"text":"一眼要認出的考點","links":[]}],[{"text":"1","links":[]},{"text":"考制：60分鐘、50題單選、70分及格；先做確定題，再回頭處理法規情境題。","links":[]}],[{"text":"2","links":[]},{"text":"六次層面樣題配比為7／7／8／10／8／10；治理三章合計56%。","links":[]}],[{"text":"3","links":[]},{"text":"提示四元素：角色、任務、背景、格式；加上限制、來源與查證要求更穩。","links":[]}],[{"text":"4","links":[]},{"text":"AI輸出流暢不等於正確；法條、數字、日期、來源逐項核對。","links":[]}],[{"text":"5","links":[]},{"text":"秘密文書不得使用生成式AI；機密、個資、未公開資訊不得輸入外部工具。","links":[]}],[{"text":"6","links":[]},{"text":"AI輸出不得直接作成行政行為或作為唯一依據；人類保有實質覆核與最終責任。","links":[]}],[{"text":"7","links":[]},{"text":"基本法七原則：永人隱安透公責。","links":[]}],[{"text":"8","links":[]},{"text":"高風險看用途與影響，不只看模型大小；控制含評估、紀錄、監督、救濟。","links":[]}],[{"text":"9","links":[]},{"text":"資料品質四字：完整、正確、真實、即時。","links":[]}],[{"text":"10","links":[]},{"text":"評測十面向：安全、解釋、韌性、公平、準確、透明、問責、可靠、隱私、資安。","links":[]}],[{"text":"11","links":[]},{"text":"分類指標依錯誤成本選precision／recall／F1；迴歸常見MAE／MSE／R²。","links":[]}],[{"text":"12","links":[]},{"text":"RAG補充可更新知識；微調改變行為模式；兩者都不能取消權限與查證。","links":[]}],[{"text":"13","links":[]},{"text":"代理式AI要有目標、範圍、工具權限、核准點、停止條件與稽核。","links":[]}],[{"text":"14","links":[]},{"text":"提示注入常藏在外部文件；把外部內容視為資料，不得覆寫高階規則。","links":[]}],[{"text":"15","links":[]},{"text":"最小權限、職務分離、日誌、事件應變是Agentic AI基本防線。","links":[]}],[{"text":"16","links":[]},{"text":"公有雲快但控制依條款；地端控制較多但成本與維運較高，沒有零風險模式。","links":[]}],[{"text":"17","links":[]},{"text":"數位包容：保留替代管道、無障礙、語言與第一線支援。","links":[]}],[{"text":"18","links":[]},{"text":"自動寄提醒與自動決定權益風險不同；越接近法律效果，監督越強。","links":[]}],[{"text":"19","links":[]},{"text":"上線不是終點：監測資料分布、模型漂移、群體差異、事故與版本。","links":[]}],[{"text":"20","links":[]},{"text":"ISO/IEC 42001是AI管理系統標準，以PDCA持續改善，不是單一模型準確率證書。","links":[]}],[{"text":"21","links":[]},{"text":"著作權保護具原創性的表達，不保護思想、程序與概念。","links":[]}],[{"text":"22","links":[]},{"text":"AI完全獨立生成、無人類實際創意投入，原則上不能成為受保護著作。","links":[]}],[{"text":"23","links":[]},{"text":"合理使用沒有固定10%門檻；綜合四因素判斷，且引用通常須明示出處。","links":[]}],[{"text":"24","links":[]},{"text":"政府內部重製有目的、必要、合理範圍與不得有害權利人等限制。","links":[]}],[{"text":"25","links":[]},{"text":"付費工具不等於取得第三方權利；商用前查模型、輸入、輸出與素材授權。","links":[]}],[{"text":"26","links":[]},{"text":"開源不等於公眾領域；CC要看BY／SA／NC／ND具體條件。","links":[]}],[{"text":"27","links":[]},{"text":"深偽既能造假，也造成『真內容被否認』的說謊者紅利。","links":[]}],[{"text":"28","links":[]},{"text":"人工在迴路要有資訊、時間、能力與權限；形式按確認不算有效監督。","links":[]}],[{"text":"29","links":[]},{"text":"外包不外卸：契約需寫資料、權利、資安、紀錄、更新、事故、移轉與終止。","links":[]}],[{"text":"30","links":[]},{"text":"遇到兩個看似正確選項，優先選『風險相稱、可查證、可追溯、有人負責』者。","links":[]}]]}]},{"title":"3｜1.1 AI基礎概念與社會影響","blocks":[{"type":"table","rows":[[{"text":"本章任務｜理解AI、機器學習、生成式AI、代理式AI的差異，以及偏誤、幻覺、深偽、數位落差等社會影響。","links":[]}]]},{"type":"table","rows":[[{"text":"記憶句｜先分『做什麼』，再看『怎麼學』，最後問『誰負責』。","links":[]}]]},{"type":"subheading","text":"高頻概念與易錯點","links":[]},{"type":"table","rows":[[{"text":"考點","links":[]},{"text":"正確判斷","links":[]},{"text":"常見陷阱／為何","links":[]}],[{"text":"01｜人工智慧的核心概念","links":[]},{"text":"AI系統依輸入推論或生成輸出，以達成預先設定或明示／默示的目標","links":[]},{"text":"判斷AI不能只看是否自動化；重點是利用模型或計算方法進行推論、預測、建議或生成。","links":[]}],[{"text":"02｜規則式系統與機器學習","links":[]},{"text":"規則式系統由人明定規則；機器學習則從資料中學得模式","links":[]},{"text":"考題常以『誰決定規則』區分：人工編寫規則與資料驅動學習並不相同。","links":[]}],[{"text":"03｜監督式學習","links":[]},{"text":"以含標記答案的資料訓練模型做分類或迴歸","links":[]},{"text":"監督式學習有明確標籤；分類預測類別，迴歸預測連續數值。","links":[]}],[{"text":"04｜非監督式學習","links":[]},{"text":"在沒有既定標籤的資料中探索群聚、結構或異常","links":[]},{"text":"非監督式學習常用於分群、降維與異常偵測，重點是沒有預先標註的目標答案。","links":[]}],[{"text":"05｜強化學習","links":[]},{"text":"代理在環境中採取行動，依獎勵訊號逐步學習策略","links":[]},{"text":"強化學習的關鍵是狀態、行動、獎勵與長期策略，而不是一次性的標記答案。","links":[]}],[{"text":"06｜深度學習與神經網路","links":[]},{"text":"以多層神經網路從大量資料學習階層式特徵","links":[]},{"text":"深度學習擅長影像、語音與語言等複雜資料，但可能需要大量資料與算力，也可能較難解釋。","links":[]}],[{"text":"07｜生成式與判別／預測式AI","links":[]},{"text":"生成式AI產生新內容；判別或預測式AI多用於分類、評分或預測","links":[]},{"text":"先看輸出型態：生成新文本／圖像，或判斷既有資料的類別與風險。","links":[]}],[{"text":"08｜大型語言模型（LLM）","links":[]},{"text":"以大量語料學習詞元序列關係，依上下文預測並生成語言","links":[]},{"text":"LLM依統計模式生成最可能的後續內容，流暢不等於真實，也不代表理解或授權無虞。","links":[]}],[{"text":"09｜生成式AI幻覺","links":[]},{"text":"模型可能產生語句流暢但事實、數字或引據錯誤的內容","links":[]},{"text":"幻覺必須用可靠來源、交叉查核與人工覆核控制，不能以語氣自信判定正確。","links":[]}],[{"text":"10｜資料與演算法偏誤","links":[]},{"text":"訓練資料、標記、特徵或設計選擇可能使特定群體受到系統性不利","links":[]},{"text":"公平評估要看資料代表性與分群結果，不能只看整體平均。","links":[]}],[{"text":"11｜可解釋性","links":[]},{"text":"能以適合利害關係人的方式說明主要因素、限制與判斷依據","links":[]},{"text":"可解釋性重點是讓適當對象理解判斷邏輯、重要因素與限制；不等於毫無保留公開機密。","links":[]}],[{"text":"12｜隱私與資料最小化","links":[]},{"text":"只蒐集與處理達成目的所必要的資料，並限制用途與保存","links":[]},{"text":"資料最小化可降低外洩、誤用與再識別風險，並應搭配目的限制、權限與保存政策。","links":[]}],[{"text":"13｜透明性","links":[]},{"text":"適度揭露使用AI、功能範圍、限制與重要影響，使使用者不被誤導","links":[]},{"text":"透明是可理解、適度、與風險相稱的資訊揭露，不要求不加區分地公開所有資訊。","links":[]}],[{"text":"14｜人類監督與最終責任","links":[]},{"text":"重要行政判斷應保留具權限人員的實質覆核、介入與更正能力","links":[]},{"text":"有效的人類監督必須有資訊、時間、能力與權限，不是形式勾選；機關仍負最終責任。","links":[]}],[{"text":"15｜深偽與合成內容","links":[]},{"text":"AI可生成高度逼真的影音，須以來源驗證、標示與偵測降低冒用及誤導","links":[]},{"text":"深偽可能影響名譽、民主、詐騙與公共信任；應採多重查證，不能依單一視覺線索。","links":[]}],[{"text":"16｜說謊者紅利（liar's dividend）","links":[]},{"text":"因深偽普及，真實證據也可能被當事人藉口稱為AI偽造","links":[]},{"text":"深偽不只製造假內容，也可能讓真內容遭否認，削弱證據與公共信任。","links":[]}],[{"text":"17｜數位落差與包容","links":[]},{"text":"AI服務應保留替代管道、無障礙設計與協助，避免弱勢被排除","links":[]},{"text":"公共服務不能把成本與能力門檻轉嫁給民眾；可近用性與多元管道是重要考點。","links":[]}],[{"text":"18｜代理式AI（Agentic AI）","links":[]},{"text":"能依目標規劃多步任務、呼叫工具並根據結果調整行動","links":[]},{"text":"代理式AI增加行動能力，也放大錯誤與權限風險，須設定目標、範圍、工具權限、停止條件與監督點。","links":[]}],[{"text":"19｜模型情境協定（MCP）與工具整合","links":[]},{"text":"以標準化方式讓模型連接資料來源或工具，仍需驗證來源與控管權限","links":[]},{"text":"標準化整合降低介接成本，但不會消除身分驗證、最小權限、輸入輸出檢查與稽核需求。","links":[]}],[{"text":"20｜邊緣AI（Edge AI）","links":[]},{"text":"在靠近資料來源的裝置上推論，可降低延遲與傳輸，但受裝置資源限制","links":[]},{"text":"邊緣部署常用於低延遲或不宜大量上傳的情境；仍須管理裝置、模型更新與存取。","links":[]}],[{"text":"21｜模型漂移（Model Drift）","links":[]},{"text":"上線後資料或環境改變，使模型表現隨時間下降或產生偏差","links":[]},{"text":"上線不是終點；需持續監測資料分布、績效、群體差異，設定告警與重訓／停用機制。","links":[]}]]},{"type":"subheading","text":"作答檢核","links":[]},{"type":"bullet","text":"先辨別輸出：分類／預測、生成內容，或能呼叫工具的多步代理。","links":[]},{"type":"bullet","text":"看到『一定、完全、只要』等絕對語句先檢查；AI治理通常要求風險相稱與多層控制。","links":[]},{"type":"bullet","text":"社會影響題不只找技術錯誤，也要看弱勢、信任、深偽與人類責任。","links":[]}]},{"title":"4｜1.2 生成式AI與人機互動","blocks":[{"type":"table","rows":[[{"text":"本章任務｜能以角色、任務、背景、格式建立提示，透過多輪修正、查證與人工覆核產出可用成果。","links":[]}]]},{"type":"table","rows":[[{"text":"記憶句｜角—任—背—格；先定界、再生成、後查證。","links":[]}]]},{"type":"subheading","text":"高頻概念與易錯點","links":[]},{"type":"table","rows":[[{"text":"考點","links":[]},{"text":"正確判斷","links":[]},{"text":"常見陷阱／為何","links":[]}],[{"text":"01｜提示（Prompt）","links":[]},{"text":"提供給生成式模型的指令、問題、背景或範例，用來引導輸出","links":[]},{"text":"提示影響輸出方向與格式，但不能取代資料品質、查證與治理。","links":[]}],[{"text":"02｜角色設定","links":[]},{"text":"指定模型應採取的專業視角與服務對象，以調整語氣和判斷框架","links":[]},{"text":"角色是提示框架，不是資格認證；仍要清楚任務與查證。","links":[]}],[{"text":"03｜任務設定","links":[]},{"text":"以明確動詞說明要完成的工作與成功條件","links":[]},{"text":"明確的行動動詞、目的與完成條件可降低歧義。","links":[]}],[{"text":"04｜背景與受眾","links":[]},{"text":"提供必要脈絡、資料範圍、對象與既有條件","links":[]},{"text":"背景要足夠且相關，並遵守資料輸入限制；受眾會影響語氣與細節。","links":[]}],[{"text":"05｜輸出格式","links":[]},{"text":"明定欄位、長度、語言、結構或範例，使結果可直接檢查與再利用","links":[]},{"text":"格式約束提升一致性與可驗證性，但內容仍需查核。","links":[]}],[{"text":"06｜目標與明確動詞","links":[]},{"text":"使用摘要、比較、分類、改寫、擷取等明確動詞，說清楚輸出用途","links":[]},{"text":"提示的核心不是堆砌關鍵字，而是讓模型理解要執行的可驗證動作。","links":[]}],[{"text":"07｜限制條件與邊界","links":[]},{"text":"明定可用資料、禁止事項、字數、時限與不確定時的處理方式","links":[]},{"text":"限制條件可降低越權與幻覺；遇到資料不足應標示未知或要求補充。","links":[]}],[{"text":"08｜零樣本提示","links":[]},{"text":"不提供示例，僅以清楚指令要求模型完成任務","links":[]},{"text":"零樣本適合一般且清楚的任務；若格式或判準複雜，可改用少樣本。","links":[]}],[{"text":"09｜少樣本提示","links":[]},{"text":"提供少量輸入輸出示例，讓模型模仿格式或判準","links":[]},{"text":"少樣本可提高格式與判準一致性，但示例必須正確、具代表性且不含敏感資料。","links":[]}],[{"text":"10｜步驟化推理","links":[]},{"text":"將複雜任務拆成可檢查的中間步驟，並要求呈現必要依據","links":[]},{"text":"可要求可驗證的計算、依據與工作步驟；重點是可檢查，不是索取內部隱藏推理。","links":[]}],[{"text":"11｜多輪迭代","links":[]},{"text":"先產出草稿，再依缺口、語氣、格式與查證結果逐輪修正","links":[]},{"text":"高品質輸出通常經過提問、檢查、補充與重寫；每輪要維持目標與版本可追溯。","links":[]}],[{"text":"12｜結構化輸出","links":[]},{"text":"要求固定欄位或JSON／表格，便於驗證、匯入與後續處理","links":[]},{"text":"結構能提升機器可讀性，但欄位驗證、例外處理與資料品質仍不可省。","links":[]}],[{"text":"13｜事實查核","links":[]},{"text":"以權威且最新來源逐項核對名稱、日期、數字與結論","links":[]},{"text":"查核要確認來源真實、日期適用、內容真正支持主張，必要時跨來源比對。","links":[]}],[{"text":"14｜引據與可追溯來源","links":[]},{"text":"要求提供可開啟的來源，並檢查引文、條號與主張是否相符","links":[]},{"text":"生成式AI可能虛構文獻與法條；可追溯性需能回到原始或權威資料。","links":[]}],[{"text":"15｜紅隊測試","links":[]},{"text":"刻意以極端、繞過、模糊或惡意輸入測試系統弱點","links":[]},{"text":"紅隊測試用來發現越權、偏誤、提示注入、洩密與失敗模式，並回饋控制措施。","links":[]}],[{"text":"16｜法律內容生成","links":[]},{"text":"把AI當檢索與草擬輔助，逐條核對現行法、適用日期與事實","links":[]},{"text":"法律資訊具有時效與精確性要求，必須由專業人員核對原始法源。","links":[]}],[{"text":"17｜公文草擬與人工覆核","links":[]},{"text":"AI可產生草稿，但承辦與權責人員須核對事實、法規、格式、語氣並負責","links":[]},{"text":"參考指引禁止完全信任或直接以未經確認的輸出作成行政行為或唯一依據。","links":[]}],[{"text":"18｜政策白話化","links":[]},{"text":"在不改變權利義務與法定要件下，改寫為受眾可理解的語言","links":[]},{"text":"白話化要同時維持精確、完整與可追溯，最好附原文或官方連結。","links":[]}],[{"text":"19｜敏感資訊輸入邊界","links":[]},{"text":"在使用外部生成式AI前，先排除機密、個資、未公開及其他受限制資料","links":[]},{"text":"輸入前治理比事後補救重要；去識別也要評估再識別與服務條款。","links":[]}],[{"text":"20｜代理任務監督者","links":[]},{"text":"設定目標、範圍、輸入／系統邊界、核准點、停止條件與異常處置","links":[]},{"text":"Agentic AI須用明確權限與人類介入點控制多步行動，尤其是對外發布、付款、刪除或權利影響。","links":[]}],[{"text":"21｜指令優先序","links":[]},{"text":"系統與機關政策等高階規則應優先於使用者或外部文件中的衝突指令","links":[]},{"text":"建立指令層級並把外部內容視為資料，可降低提示注入與越權。","links":[]}]]},{"type":"subheading","text":"作答檢核","links":[]},{"type":"bullet","text":"提示品質＝目標清楚＋必要背景＋可驗證格式＋合理限制。","links":[]},{"type":"bullet","text":"生成後至少做：來源查證、事實核對、法規／格式檢查、權責人覆核。","links":[]},{"type":"bullet","text":"Agent任務一定要問：可讀什麼、可做什麼、何時停、誰核准、怎麼追蹤。","links":[]}]},{"title":"5｜1.3 AI應用與公共服務轉型策略","blocks":[{"type":"table","rows":[[{"text":"本章任務｜依任務、資料敏感度、風險與成本選模型及部署方式，並以人本、可近用與可持續營運重塑流程。","links":[]}]]},{"type":"table","rows":[[{"text":"記憶句｜任務配模型、資料配環境、風險配監督。","links":[]}]]},{"type":"subheading","text":"高頻概念與易錯點","links":[]},{"type":"table","rows":[[{"text":"考點","links":[]},{"text":"正確判斷","links":[]},{"text":"常見陷阱／為何","links":[]}],[{"text":"01｜依任務選擇預測或生成模型","links":[]},{"text":"分類、評分、預測與內容生成的目的不同，應先定義任務再選模型","links":[]},{"text":"任務—資料—輸出—風險是模型選擇起點；不是功能越多越適合。","links":[]}],[{"text":"02｜問題定義與成功條件","links":[]},{"text":"先界定服務痛點、對象、預期效益、限制與可衡量指標","links":[]},{"text":"公部門AI導入應從問題與公共價值出發，並在技術前確認需求、資料與流程可行性。","links":[]}],[{"text":"03｜資料敏感度與部署選擇","links":[]},{"text":"資料越敏感、權利影響越高，越需要受控環境、權限與審核","links":[]},{"text":"部署模式必須與資料分類、供應商條款、存取控制及退出方案一起評估。","links":[]}],[{"text":"04｜公有雲、私有／地端部署","links":[]},{"text":"公有雲通常導入快；私有或地端可增加控制，但成本、維運與更新負擔較高","links":[]},{"text":"沒有絕對最佳部署；應比較資料流、合約、權限、更新、監測、成本與業務持續性。","links":[]}],[{"text":"05｜在地模型與TAIDE","links":[]},{"text":"在地語言文化與政府情境可改善適切性，但仍須以任務資料評測","links":[]},{"text":"在地化是選型因素，不是品質與法遵保證；需以實際使用案例比較。","links":[]}],[{"text":"06｜邊緣部署策略","links":[]},{"text":"低延遲、連線不穩或資料不宜大量外傳時，可評估在裝置端推論","links":[]},{"text":"邊緣AI可縮短反應與減少傳輸，但算力、功耗、版本與設備安全需管理。","links":[]}],[{"text":"07｜延遲、成本與吞吐量","links":[]},{"text":"模型選型應依可接受反應時間、同時使用量、單次成本與服務層級測試","links":[]},{"text":"效能驗收要在代表性負載與尖峰情境測試，納入API、網路、運算與人工覆核成本。","links":[]}],[{"text":"08｜檢索增強生成（RAG）","links":[]},{"text":"先檢索受控知識來源，再讓模型依檢索內容生成並保留引據","links":[]},{"text":"RAG可提升可追溯與時效，但依賴索引品質、權限、切分、檢索與引用驗證。","links":[]}],[{"text":"09｜微調（Fine-tuning）","links":[]},{"text":"以特定資料調整既有模型行為，適合穩定風格或任務模式","links":[]},{"text":"微調與RAG目的不同：前者調整模型行為，後者補充可更新知識；兩者都需資料治理。","links":[]}],[{"text":"10｜API與系統整合","links":[]},{"text":"應使用身分驗證、最小權限、輸入輸出檢查、錯誤處理、速率限制與稽核","links":[]},{"text":"整合會把模型風險帶入業務流程，需用工程與治理控制形成防線。","links":[]}],[{"text":"11｜數位包容的服務設計","links":[]},{"text":"從不同年齡、語言、障礙、設備與網路條件測試可近用性","links":[]},{"text":"公共服務須避免新科技擴大既有不平等；要做多族群測試與替代方案。","links":[]}],[{"text":"12｜多元服務管道","links":[]},{"text":"線上AI、網站、電話、臨櫃等管道應互補並可順利轉接","links":[]},{"text":"多管道設計可降低排除並提供故障備援；資訊版本與案件交接要一致。","links":[]}],[{"text":"13｜無障礙與易讀","links":[]},{"text":"支援鍵盤、螢幕閱讀器、清楚標籤、足夠對比、字幕與白話內容","links":[]},{"text":"可近用性應在需求、設計與驗收各階段由真實使用者測試。","links":[]}],[{"text":"14｜第一線可行性驗證","links":[]},{"text":"讓實際承辦與使用者參與流程盤點、原型測試及例外情境檢查","links":[]},{"text":"第一線知道資料缺口、例外與責任斷點，早期參與可避免『技術可行、業務不可用』。","links":[]}],[{"text":"15｜人本流程再設計","links":[]},{"text":"用AI減少重複負擔，把人力集中於同理、裁量、協調與例外處理","links":[]},{"text":"轉型不只是自動化舊步驟，而是重分配工作、責任與服務接點。","links":[]}],[{"text":"16｜作業自動化與決策自動化","links":[]},{"text":"自動整理或通知通常低於直接決定權利義務的風險","links":[]},{"text":"決策越接近法律效果、基本權或重大利益，越需要可解釋、人工監督與救濟。","links":[]}],[{"text":"17｜代理工作流拆解","links":[]},{"text":"把目標拆成可驗證步驟，為每步設定工具、輸入、輸出、權限與失敗處理","links":[]},{"text":"多步任務要能觀測、暫停、重試、復原與人工接管。","links":[]}],[{"text":"18｜最小權限","links":[]},{"text":"只授與完成當前任務所需的最少資料與操作權限，並限制時間與範圍","links":[]},{"text":"最小權限能限制提示注入、模型錯誤或帳號遭冒用時的損害半徑。","links":[]}],[{"text":"19｜人機協作核准點","links":[]},{"text":"在對外發布、付款、刪除、權利判斷等高影響動作前設實質人工核准","links":[]},{"text":"人工介入應風險導向；核准者要能看見依據、異常與模型限制。","links":[]}],[{"text":"20｜供應商鎖定與可攜性","links":[]},{"text":"採購時要求資料／紀錄可匯出、介面與格式明確、退出及移轉安排","links":[]},{"text":"退出策略可降低價格、營運與資料控制風險，並支持持續服務。","links":[]}],[{"text":"21｜概念驗證與試辦","links":[]},{"text":"以小範圍、代表性資料和明確指標驗證價值、風險與整合可行性","links":[]},{"text":"PoC回答技術能否運作；試辦還要驗證流程、人員、治理與實際效益。","links":[]}],[{"text":"22｜成效指標","links":[]},{"text":"同時衡量品質、時間、成本、使用者體驗、公平、風險與人工負擔","links":[]},{"text":"公共服務效益是多面向的；技術指標須連結服務結果與風險。","links":[]}],[{"text":"23｜變革管理與能力建構","links":[]},{"text":"清楚分工、教育訓練、操作規範、回饋機制與管理支持應同步進行","links":[]},{"text":"AI導入是組織變革；人員需理解何時用、如何查、遇到異常怎麼停與通報。","links":[]}],[{"text":"24｜降級、備援與營運持續","links":[]},{"text":"AI失效、延遲或品質下降時，應能切回人工或替代流程並保留資料一致性","links":[]},{"text":"公共服務須設定失敗模式、SLA、備援、復原與定期演練。","links":[]}]]},{"type":"subheading","text":"作答檢核","links":[]},{"type":"bullet","text":"選型不要只看模型大或品牌；把資料敏感度、延遲、成本、整合、維運一起比較。","links":[]},{"type":"bullet","text":"公共服務不能只追求線上化；多元管道、無障礙與人工接管都是服務品質。","links":[]},{"type":"bullet","text":"技術驗證成功不等於可正式上線；還要驗流程、責任、例外、持續監測與退場。","links":[]}]},{"title":"6｜2.1 AI政策與治理指引","blocks":[{"type":"table","rows":[[{"text":"本章任務｜掌握人工智慧基本法、AI生命週期、風險分級、資料治理、評測、採購與持續監測。","links":[]}]]},{"type":"table","rows":[[{"text":"記憶句｜事前分級、事中留痕、事後監測；高風險加強救濟。","links":[]}]]},{"type":"subheading","text":"高頻概念與易錯點","links":[]},{"type":"table","rows":[[{"text":"考點","links":[]},{"text":"正確判斷","links":[]},{"text":"常見陷阱／為何","links":[]}],[{"text":"01｜人工智慧基本法的AI定義","links":[]},{"text":"以數位技術為基礎，透過模型或演算法展現學習、推論、預測、建議、決策或內容生成等能力","links":[]},{"text":"基本法採功能性定義，涵蓋多種輸出與能力，不以特定技術或外觀為限。","links":[]}],[{"text":"02｜基本法七項原則總覽","links":[]},{"text":"永續福祉、人類自主、隱私與資料治理、資安與安全、透明可解釋、公平不歧視、問責","links":[]},{"text":"七原則是治理考題核心；可用『永人隱安透公責』記憶。","links":[]}],[{"text":"03｜永續發展與人類福祉","links":[]},{"text":"AI發展應兼顧社會、環境與公共利益，增進人類福祉","links":[]},{"text":"效益評估不只技術與財務，也包含社會、環境與世代影響。","links":[]}],[{"text":"04｜人類自主","links":[]},{"text":"AI應尊重人的尊嚴、權利與自主，避免不當操控並保留人類控制","links":[]},{"text":"人類自主要求真實選擇、知情與有效介入，特別是高影響情境。","links":[]}],[{"text":"05｜隱私保護與資料治理","links":[]},{"text":"依目的與必要性管理蒐集、處理、利用、品質、權限與生命週期","links":[]},{"text":"資料治理涵蓋法源、品質、血緣、存取、保存、刪除與再利用。","links":[]}],[{"text":"06｜資安與安全","links":[]},{"text":"採風險相稱的技術與組織措施，防止攻擊、濫用、失效與傷害","links":[]},{"text":"AI安全包括傳統資安、模型與資料攻擊、可靠運作及事故應變。","links":[]}],[{"text":"07｜透明性與可解釋性","links":[]},{"text":"依風險提供使用AI、資料與主要邏輯、限制和影響的適度說明","links":[]},{"text":"透明與可解釋應對象化、風險化，並兼顧安全、個資與營業秘密。","links":[]}],[{"text":"08｜公平與不歧視","links":[]},{"text":"檢查資料與結果對不同群體的差異，防止不合理差別待遇","links":[]},{"text":"形式相同不等於實質公平；應在設計、測試與監測各階段評估群體影響。","links":[]}],[{"text":"09｜問責","links":[]},{"text":"明確指定決策、資料、模型、操作與監督責任，並可稽核與救濟","links":[]},{"text":"問責需要角色、紀錄、監督、事件處理與救濟串成可追溯機制。","links":[]}],[{"text":"10｜基本法禁止或防免傷害","links":[]},{"text":"應防止AI危害人民生命、身體、自由、財產、社會秩序或公共利益，並特別關注兒少","links":[]},{"text":"基本法同時促進創新與防免危害，兒少等脆弱群體須採相稱保護。","links":[]}],[{"text":"11｜國家AI戰略治理","links":[]},{"text":"跨部會治理需協調政策、資源、風險與社會影響，而非由單一技術單位獨立決定","links":[]},{"text":"AI治理需要政策協調與共同原則，避免重複投資與責任斷裂。","links":[]}],[{"text":"12｜政府AI施政績效揭露","links":[]},{"text":"治理應持續盤點與報告推動成果、風險管理與改善，而非只報導成功案例","links":[]},{"text":"持續報告有助透明、問責與政策調整，指標應包含效益與風險。","links":[]}],[{"text":"13｜資料開放、共享與再利用","links":[]},{"text":"在法令、隱私、資安、文化與智慧財產權界線內促進可用資料","links":[]},{"text":"開放與保護需平衡；應先確認法源、品質、權利、敏感性與使用條件。","links":[]}],[{"text":"14｜隱私設計與預設保護","links":[]},{"text":"從系統設計初期嵌入保護，預設採最少蒐集、最小公開與適當權限","links":[]},{"text":"Privacy by design/default是前置、內建與預設保護，不是事後文件。","links":[]}],[{"text":"15｜風險分級","links":[]},{"text":"依用途、影響程度與發生可能性採差異化義務，風險越高控制越強","links":[]},{"text":"風險分級避免一刀切；低風險仍需基本安全與法遵，高風險需更強評估、監督與救濟。","links":[]}],[{"text":"16｜高風險責任、救濟與保險","links":[]},{"text":"高風險AI應強化責任分配、受影響者救濟、損害填補與必要保險機制","links":[]},{"text":"保險是風險分擔的一環，不能取代設計、監督、說明與救濟。","links":[]}],[{"text":"17｜政府風險評估與內控","links":[]},{"text":"政府使用AI前後應評估風險並建立規範、權限、紀錄、監督與改善機制","links":[]},{"text":"政府是AI使用者與公共權力行使者，須以制度化內控落實問責。","links":[]}],[{"text":"18｜AI生命週期治理","links":[]},{"text":"從立案、資料與開發、驗證部署到營運退場都持續管理風險","links":[]},{"text":"風險會隨資料、模型、環境與用途改變，治理必須覆蓋全生命週期。","links":[]}],[{"text":"19｜資料完整性","links":[]},{"text":"必要欄位與樣本是否充分存在，缺漏情形可被辨識與處理","links":[]},{"text":"完整性關注『有沒有缺』；與正確性、真實性、時效性要分開判斷。","links":[]}],[{"text":"20｜資料正確性","links":[]},{"text":"資料值是否正確反映原始事實並符合合理範圍","links":[]},{"text":"正確性關注值是否錯誤；完整不代表正確。","links":[]}],[{"text":"21｜資料真實性／可信度","links":[]},{"text":"資料來源、蒐集方法與內容是否可信、未被偽造或污染","links":[]},{"text":"可信度關注來源與內容真偽，尤其是外部資料、標註與合成資料。","links":[]}],[{"text":"22｜資料時效性","links":[]},{"text":"資料更新頻率與時間點是否足以支援當前決策","links":[]},{"text":"過時資料可能導致模型在新政策或行為環境中失效。","links":[]}],[{"text":"23｜資料血緣與可追溯性","links":[]},{"text":"能追查資料來源、轉換、版本、使用與模型產出之間的關係","links":[]},{"text":"資料血緣支援查錯、稽核、權利處理、重現與事故調查。","links":[]}],[{"text":"24｜群體差異檢驗","links":[]},{"text":"除整體指標外，按性別、地區、年齡等適當群體比較錯誤率與影響","links":[]},{"text":"分群分析可發現平均值掩蓋的不公平；群體選擇也應避免不當蒐集敏感資料。","links":[]}],[{"text":"25｜風險＝影響×可能性","links":[]},{"text":"同時考量後果嚴重度與事件發生機率，並依殘餘風險決定控制","links":[]},{"text":"風險評估應描述危害、受影響者、可能性、既有控制與殘餘風險。","links":[]}],[{"text":"26｜AI評測十面向","links":[]},{"text":"安全、可解釋、韌性、公平、準確、透明、問責、可靠、隱私、資安需依情境綜合評估","links":[]},{"text":"十面向互相關聯但不可互相替代；評測要與用途與風險相稱。","links":[]}],[{"text":"27｜準確性與可靠性","links":[]},{"text":"準確性看結果貼近真值；可靠性看在不同條件與時間下能否穩定符合要求","links":[]},{"text":"高分但不穩定的模型仍可能不可用；應測不同族群、負載、環境與時間。","links":[]}],[{"text":"28｜分類與迴歸驗收指標","links":[]},{"text":"分類可看precision、recall、F1；迴歸可看MAE、MSE、R²，須依錯誤成本選擇","links":[]},{"text":"沒有單一萬用指標；漏判與誤判成本不同時，應選相符指標與門檻。","links":[]}],[{"text":"29｜持續監測與模型漂移","links":[]},{"text":"監測資料分布、績效、群體差異、使用情境與事故，設告警、重訓或停用門檻","links":[]},{"text":"正式營運必須有基準、頻率、責任人與處置流程。","links":[]}],[{"text":"30｜採購與治理責任","links":[]},{"text":"契約應明定資料權利、資安、紀錄、測試、變更、事故、SLA、移轉與終止責任","links":[]},{"text":"採購是治理工具；外包不外卸公法責任，關鍵控制要寫進契約並可驗證。","links":[]}]]},{"type":"subheading","text":"作答檢核","links":[]},{"type":"bullet","text":"七原則要能從情境辨認，不只背名稱。","links":[]},{"type":"bullet","text":"資料品質四面向要分清；完整≠正確，正確≠即時，來源可信另屬真實性。","links":[]},{"type":"bullet","text":"治理跨全生命週期；高風險題優先找分級、人工監督、救濟、紀錄與持續監測。","links":[]}]},{"title":"7｜2.2 AI法規與資安風險管理","blocks":[{"type":"table","rows":[[{"text":"本章任務｜辨識秘密、個資、未公開資訊與供應鏈風險，落實存取控制、稽核紀錄、事件應變與管理制度。","links":[]}]]},{"type":"table","rows":[[{"text":"記憶句｜不能放、不能信、不能直出；能控權、能稽核、能復原。","links":[]}]]},{"type":"subheading","text":"高頻概念與易錯點","links":[]},{"type":"table","rows":[[{"text":"考點","links":[]},{"text":"正確判斷","links":[]},{"text":"常見陷阱／為何","links":[]}],[{"text":"01｜秘密文書與生成式AI","links":[]},{"text":"機密文書應由承辦人撰寫，不得使用生成式AI處理","links":[]},{"text":"參考指引對秘密文書採明確限制；不能用去標示或事後刪除取代規範。","links":[]}],[{"text":"02｜機密、個資與未公開資訊輸入","links":[]},{"text":"不得將機密、個人資料或未公開資訊提供給外部生成式AI，也不得詢問相關問題","links":[]},{"text":"風險包括留存、訓練、跨境、供應商存取與再識別；應在輸入前阻止。","links":[]}],[{"text":"03｜封閉／地端環境的使用條件","links":[]},{"text":"須先確認安全性並依資料分級、權限與機關規範使用，不能因地端就自動放行","links":[]},{"text":"封閉環境降低部分外傳風險，但仍有權限、內部人、供應鏈、模型與終端安全。","links":[]}],[{"text":"04｜不得完全信任或作為唯一依據","links":[]},{"text":"AI輸出須查證，不得直接作成行政行為或作為唯一判斷依據","links":[]},{"text":"行政行為涉及法定權限與人民權益，必須有專業判斷、法源核對與責任人。","links":[]}],[{"text":"05｜生成式AI使用揭露","links":[]},{"text":"依情境適度揭露使用AI及其角色，避免使民眾誤認完全由人產出或審查","links":[]},{"text":"揭露應與風險、影響與使用方式相稱；透明不取代品質與法遵。","links":[]}],[{"text":"06｜法規遵循與機關內控","links":[]},{"text":"應遵守資安、個資、著作權及資訊處理規範，機關並可制定更具體控制","links":[]},{"text":"參考指引是底線框架，實際使用還要套用個別法規、資料分類與內控。","links":[]}],[{"text":"07｜委外廠商遵循義務","links":[]},{"text":"採購契約應要求廠商遵守指引與機關規範，並約定稽核、通報和資料處理責任","links":[]},{"text":"供應鏈也是資料與模型風險的一部分；義務必須可執行、可稽核並有違約處理。","links":[]}],[{"text":"08｜採購底價與保留資訊","links":[]},{"text":"採購底價、評選未公開內容等不得輸入外部生成式AI","links":[]},{"text":"未公開採購資訊涉及公平、廉政、營業與機關權益，應受嚴格輸入限制。","links":[]}],[{"text":"09｜身分證號與個資","links":[]},{"text":"身分證號等可直接或間接識別個人的資料，應依目的、必要性與安全措施處理","links":[]},{"text":"個資保護涵蓋蒐集、處理、利用與安全；技術措施不能取代合法目的與最小化。","links":[]}],[{"text":"10｜未公開政策草案","links":[]},{"text":"未公開政策、會議資料與內部意見不得任意輸入外部生成式AI","links":[]},{"text":"未公開不只等於機密；參考指引明確涵蓋依法應保密或未公開資訊。","links":[]}],[{"text":"11｜內部簽核意見","links":[]},{"text":"內部簽辦、會議意見與權責判斷可能屬未公開或受限制資訊，應先依規範分類","links":[]},{"text":"是否可輸入要看內容、法規、公開狀態與服務條款，不可只做表面去識別。","links":[]}],[{"text":"12｜影子AI（Shadow AI）","links":[]},{"text":"未經核准的AI工具、帳號或流程會繞過安全、採購與紀錄控制","links":[]},{"text":"影子AI常因方便而出現；治理需有允許清單、教育、替代工具、偵測與處理程序。","links":[]}],[{"text":"13｜最小權限與職務分離","links":[]},{"text":"依角色授與最少必要權限，將開發、核准、部署與稽核適度分離","links":[]},{"text":"最小權限限制損害，職務分離降低單點濫用與錯誤。","links":[]}],[{"text":"14｜日誌與稽核軌跡","links":[]},{"text":"記錄誰在何時以何權限使用哪些版本、資料與工具，以及核准與輸出處理","links":[]},{"text":"日誌應最小且足夠，並受存取、保存與完整性保護，以支援追查與問責。","links":[]}],[{"text":"15｜傳輸與儲存安全","links":[]},{"text":"敏感資料應依規範加密傳輸與儲存、妥善管理金鑰並限制存取","links":[]},{"text":"加密是重要防線，但須搭配金鑰管理、端點安全、備份與權限。","links":[]}],[{"text":"16｜提示注入","links":[]},{"text":"攻擊者把惡意指令藏在使用者輸入、網頁或文件，誘使模型忽略原規則或洩密","links":[]},{"text":"應以指令分層、外部內容隔離、工具權限、輸出檢查與人工核准降低風險。","links":[]}],[{"text":"17｜對抗樣本","links":[]},{"text":"攻擊者對輸入做細微設計，使模型產生錯誤分類或行為","links":[]},{"text":"對抗攻擊利用模型弱點；可用魯棒性測試、輸入檢查、監測與分層防禦。","links":[]}],[{"text":"18｜資料投毒","links":[]},{"text":"在訓練或回饋資料中植入惡意或偏誤內容，改變模型行為","links":[]},{"text":"需控管資料來源、版本、完整性、標註、異常與供應鏈。","links":[]}],[{"text":"19｜模型抽取","links":[]},{"text":"攻擊者透過大量查詢推測或複製模型能力、參數或敏感行為","links":[]},{"text":"可用身分驗證、速率限制、異常偵測、輸出限制與契約控制降低模型竊取。","links":[]}],[{"text":"20｜AI供應鏈風險","links":[]},{"text":"模型、資料、開源套件、API與雲端服務任一環節都可能引入漏洞、權利或持續供應風險","links":[]},{"text":"應盤點元件、來源、版本、授權、弱點、更新、次處理者與退出安排。","links":[]}],[{"text":"21｜AI資安事件應變","links":[]},{"text":"事前定義偵測、通報、隔離、證據保存、復原、通知與改善責任","links":[]},{"text":"AI事件可能同時涉及資料、模型、服務與權利，需與既有資安及個資應變整合。","links":[]}],[{"text":"22｜ISO/IEC 42001","links":[]},{"text":"以PDCA建立、實施、維持並持續改善AI管理系統，治理組織的AI風險與機會","links":[]},{"text":"42001是管理系統標準，重點在政策、角色、風險、控制、監測與持續改善。","links":[]}],[{"text":"23｜不可接受與高風險","links":[]},{"text":"不可接受風險可能被禁止；高風險則需嚴格評估、資料、紀錄、監督與救濟","links":[]},{"text":"風險分級看用途與影響，不是技術名稱；控制強度隨風險提高。","links":[]}],[{"text":"24｜福利資格與高影響決策","links":[]},{"text":"直接影響福利取得的AI通常屬高風險，須強化資料品質、可解釋、人工監督與申訴","links":[]},{"text":"對基本生活與權利影響重大時，應避免單一自動決策並提供有效救濟。","links":[]}]]},{"type":"subheading","text":"作答檢核","links":[]},{"type":"bullet","text":"先判斷資料能否輸入，再談提示技巧；禁輸資料不能靠事後刪除補救。","links":[]},{"type":"bullet","text":"地端、加密、付費或知名供應商都不是零風險證明。","links":[]},{"type":"bullet","text":"攻擊辨識：提示注入＝惡意指令；投毒＝污染訓練資料；抽取＝大量查詢複製模型。","links":[]}]},{"title":"8｜2.3 AI倫理、責任與著作權","blocks":[{"type":"table","rows":[[{"text":"本章任務｜維持人類最終責任，檢查公平與在地影響，並處理揭露、授權、合理使用、人格權與承攬權利歸屬。","links":[]}]]},{"type":"table","rows":[[{"text":"記憶句｜有揭露、有來源、有授權、有人負責。","links":[]}]]},{"type":"subheading","text":"高頻概念與易錯點","links":[]},{"type":"table","rows":[[{"text":"考點","links":[]},{"text":"正確判斷","links":[]},{"text":"常見陷阱／為何","links":[]}],[{"text":"01｜人類最終責任","links":[]},{"text":"公務機關與權責人員仍須為AI輔助的決策、內容與行政結果負責","links":[]},{"text":"AI是工具或系統元件，不能取代法定權限、專業義務與問責。","links":[]}],[{"text":"02｜公平與社會影響","links":[]},{"text":"應檢視不同群體、地區與情境的利益與負擔分配，並採取補救","links":[]},{"text":"負責任AI要求持續評估實質影響，不只形式一致。","links":[]}],[{"text":"03｜在地語言與文化","links":[]},{"text":"需測試臺灣語言、用語、制度與文化情境，避免錯誤、刻板印象與排除","links":[]},{"text":"在地化需資料、使用者測試與專業覆核，不能只看介面語言。","links":[]}],[{"text":"04｜AI協作揭露","links":[]},{"text":"依規範與影響程度說明AI參與範圍、人工覆核及必要限制","links":[]},{"text":"揭露支持透明與信任，但仍要確保品質、權利與責任。","links":[]}],[{"text":"05｜來源查證與引用倫理","links":[]},{"text":"引用AI找到的資料時應回到原始來源確認內容、作者、日期與授權","links":[]},{"text":"生成式AI可能混淆或虛構來源；學術與公務使用都應可追溯。","links":[]}],[{"text":"06｜幻覺的倫理風險","links":[]},{"text":"流暢錯誤可能誤導民眾、影響權益與信任，須以查證、限制用途和人工覆核處理","links":[]},{"text":"幻覺無法靠單一參數完全消除；應依影響採多層控制。","links":[]}],[{"text":"07｜資訊過時","links":[]},{"text":"模型知識與檢索資料可能落後，應核對生效日期、版本與最新官方公告","links":[]},{"text":"法規、政策與聯絡資訊具高度時效性；版本管理是核心。","links":[]}],[{"text":"08｜深偽與冒用","links":[]},{"text":"應驗證來源、脈絡與內容真實性，並處理冒名、詐騙、人格權與公共信任風險","links":[]},{"text":"標示只是控制之一，仍要檢查同意、權利、誤導與損害。","links":[]}],[{"text":"09｜浮水印與內容憑證","links":[]},{"text":"可協助辨識來源與編輯歷程，但可能被移除或未被普遍採用，不能單獨證明真偽","links":[]},{"text":"來源標記需搭配簽章、平台資料、原始檔與交叉查證。","links":[]}],[{"text":"10｜自動化偏誤","links":[]},{"text":"人可能過度相信AI建議而忽略反證，因此需訓練、界面提示、獨立查核與可拒絕權","links":[]},{"text":"人工在迴路若缺乏能力、資訊或時間，仍可能只是橡皮圖章。","links":[]}],[{"text":"11｜人格尊嚴與個人自主","links":[]},{"text":"AI應避免操控、羞辱、標籤或不當推論個人，並尊重知情與選擇","links":[]},{"text":"倫理評估超越最低法遵，需看權力不對等、脆弱群體與社會後果。","links":[]}],[{"text":"12｜肖像與形象利用","links":[]},{"text":"使用真人臉孔、聲音或形象生成內容前，應確認同意、授權、用途與不誤導","links":[]},{"text":"著作權外，仍可能涉及人格權、肖像、個資與不正競爭等風險。","links":[]}],[{"text":"13｜著作保護表達而非思想","links":[]},{"text":"著作權保護具原創性的表達，不及思想、程序、系統、概念或原理本身","links":[]},{"text":"著作權法第10條之1區分表達與思想；但具體利用仍要看是否重製或改作受保護表達。","links":[]}],[{"text":"14｜法令與公文非著作權標的","links":[]},{"text":"憲法、法律、命令、公文及依法考試試題等依著作權法第9條不得為著作權標的","links":[]},{"text":"第9條有特定範圍；公文包括公務員職務上草擬的文告、講稿、新聞稿等，但仍要注意個資、保密與其他權利。","links":[]}],[{"text":"15｜著作權自完成時發生","links":[]},{"text":"符合著作要件的創作於完成時享有著作權，原則上不以登記為必要","links":[]},{"text":"臺灣採創作保護原則；權利歸屬與授權仍可能受僱傭或出資契約影響。","links":[]}],[{"text":"16｜純AI生成與人類創意投入","links":[]},{"text":"完全由AI獨立生成且無人類實際創意投入的內容，原則上無法取得著作權保護","links":[]},{"text":"智慧財產局見解以人類實際創意投入為關鍵；把AI當輔助工具且有人類創作，該人類創作部分可能受保護。","links":[]}],[{"text":"17｜職務著作","links":[]},{"text":"受僱人職務上完成著作原則以受僱人為著作人、財產權歸雇用人；契約另有約定者從其約定，公務員亦包含在內","links":[]},{"text":"著作權法第11條可由契約調整著作人與財產權歸屬，考題常測『著作人』與『財產權人』不同。","links":[]}],[{"text":"18｜出資聘請著作","links":[]},{"text":"原則以受聘人為著作人；財產權依契約，未約定時歸受聘人，出資人得利用","links":[]},{"text":"著作權法第12條顯示契約的重要性；AI委外案應明確約定成果、資料與再利用。","links":[]}],[{"text":"19｜翻譯與改作","links":[]},{"text":"翻譯、改寫等可能屬改作，原則上需確認原著作權利或合理使用依據","links":[]},{"text":"使用AI不改變利用行為的法律性質；權利人、授權範圍與合理使用仍須判斷。","links":[]}],[{"text":"20｜政府內部重製","links":[]},{"text":"中央或地方機關因立法或行政目的必要，在合理範圍可將他人著作重製為內部參考，但不得不當損害權利人利益","links":[]},{"text":"第44條有目的、必要、合理範圍與不得有害權利人利益等限制，不能概括擴張。","links":[]}],[{"text":"21｜合理引用","links":[]},{"text":"為報導、評論、教學、研究或其他正當目的，在必要與合理範圍可引用已公開發表著作","links":[]},{"text":"第52條的引用須有正當目的、已公開、合理範圍與主從關係；並應明示出處。","links":[]}],[{"text":"22｜明示出處","links":[]},{"text":"依法合理利用特定著作時，通常仍須以合理方式標示來源與作者","links":[]},{"text":"著作權法第64條要求多種合理利用情形明示出處；學術倫理也要求可追溯。","links":[]}],[{"text":"23｜合理使用四因素","links":[]},{"text":"應綜合目的性質、著作性質、利用質量比例及對潛在市場／價值影響判斷","links":[]},{"text":"合理使用沒有單一固定比例或自動安全門檻，須依個案整體衡量。","links":[]}],[{"text":"24｜實質近似與生成內容","links":[]},{"text":"AI生成結果若與受保護原作在具原創性的表達上實質近似，仍可能侵權","links":[]},{"text":"智慧財產局提醒生成成果仍可能與原作實質近似；使用前應檢查、釐清授權與服務條款。","links":[]}],[{"text":"25｜授權條款與商業利用","links":[]},{"text":"應確認模型、輸入資料與輸出之授權範圍、轉授權、商用、訓練及責任條款","links":[]},{"text":"工具條款只能處理平台與使用者關係，不能憑空消除第三方權利。","links":[]}],[{"text":"26｜創用CC授權","links":[]},{"text":"依所選CC條件履行姓名標示、相同方式分享、非商業或禁止改作等要求","links":[]},{"text":"先辨識具體授權標章與版本，再檢查BY、SA、NC、ND及素材來源。","links":[]}],[{"text":"27｜開源不等於公眾領域","links":[]},{"text":"開源軟體或模型仍受著作權與授權條款規範，使用者須履行條件","links":[]},{"text":"開源是依授權給予權利，不是無權利；需看署名、衍生、散布、專利與模型資料條款。","links":[]}],[{"text":"28｜通知取下與網路服務免責","links":[]},{"text":"服務提供者須符合政策、通知、移除／阻斷等法定條件，才可能適用責任限制","links":[]},{"text":"著作權法第90條之4至之12設不同服務類型的免責條件，重點是符合程序而非全面免責。","links":[]}],[{"text":"29｜AI委外契約的權利條款","links":[]},{"text":"應明定資料來源、訓練權、輸入輸出權利、第三方侵權、標示、稽核、賠償與交付格式","links":[]},{"text":"AI成果可能涉及多層權利與供應鏈，條款必須具體且可驗證。","links":[]}],[{"text":"30｜倫理揭露與稽核軌跡","links":[]},{"text":"保存AI用途、版本、提示／資料來源、人工修改、核准與發布資訊，依風險適度揭露","links":[]},{"text":"完整而受控的紀錄支援重現、爭議處理、權利證明與改進；公開範圍仍需分級。","links":[]}]]},{"type":"subheading","text":"作答檢核","links":[]},{"type":"bullet","text":"揭露不會自動免責；仍要查證、授權與人工負責。","links":[]},{"type":"bullet","text":"著作權題先拆：誰創作、誰有財產權、做了什麼利用、是否有授權／合理使用。","links":[]},{"type":"bullet","text":"看到『註明來源就一定合法』『非營利就一定合理使用』『付費就有全部權利』多半是陷阱。","links":[]}]},{"title":"4｜人工智慧基本法20條速覽","blocks":[{"type":"table","rows":[[{"text":"必背核心｜第3條定義；第4條七原則；第5條防免危害；第16條風險分類；第17條高風險責任與救濟；第19條政府風險評估與內控。","links":[]}]]},{"type":"table","rows":[[{"text":"條次","links":[]},{"text":"主題","links":[]},{"text":"考前一句話","links":[]}],[{"text":"第1條","links":[]},{"text":"立法目的","links":[]},{"text":"促進AI發展與應用、保障人民基本權、增進福祉並兼顧風險治理。","links":[]}],[{"text":"第2條","links":[]},{"text":"主管與協調","links":[]},{"text":"中央主管機關與各目的事業主管機關依職掌協力推動。","links":[]}],[{"text":"第3條","links":[]},{"text":"AI定義","links":[]},{"text":"以數位技術透過模型或演算法展現學習、推論、預測、建議、決策或生成等能力。","links":[]}],[{"text":"第4條","links":[]},{"text":"七項原則","links":[]},{"text":"永續福祉、人類自主、隱私資料治理、資安安全、透明可解釋、公平不歧視、問責。","links":[]}],[{"text":"第5條","links":[]},{"text":"防免危害","links":[]},{"text":"避免危害生命、身體、自由、財產、社會秩序與公共利益，並重視兒少保護。","links":[]}],[{"text":"第6條","links":[]},{"text":"國家策略協調","links":[]},{"text":"以國家層級機制統籌AI政策、資源與跨部會治理。","links":[]}],[{"text":"第7條","links":[]},{"text":"教育與人才","links":[]},{"text":"推動AI教育、人才培育與全民素養。","links":[]}],[{"text":"第8條","links":[]},{"text":"研發與創新","links":[]},{"text":"支持研究、產業創新、基礎建設與負責任發展。","links":[]}],[{"text":"第9條","links":[]},{"text":"勞動與社會調適","links":[]},{"text":"關注就業轉型、職能培育與社會影響。","links":[]}],[{"text":"第10條","links":[]},{"text":"施政績效","links":[]},{"text":"政府持續盤點、評估並揭露AI推動與治理成果。","links":[]}],[{"text":"第11條","links":[]},{"text":"國際合作","links":[]},{"text":"參與國際規範、技術與治理合作。","links":[]}],[{"text":"第12條","links":[]},{"text":"公私協力","links":[]},{"text":"鼓勵政府、產業、學研與社會多方協作。","links":[]}],[{"text":"第13條","links":[]},{"text":"資料利用","links":[]},{"text":"在安全、隱私、文化與智慧財產權前提下促進資料開放、共享與再利用。","links":[]}],[{"text":"第14條","links":[]},{"text":"隱私設計","links":[]},{"text":"將隱私保護納入設計與預設設定，落實必要性與最小化。","links":[]}],[{"text":"第15條","links":[]},{"text":"法規調適","links":[]},{"text":"檢討既有法規與監理工具，使創新與權利保障並行。","links":[]}],[{"text":"第16條","links":[]},{"text":"風險分類","links":[]},{"text":"參照國際作法依用途與影響建立風險分類與差異化治理。","links":[]}],[{"text":"第17條","links":[]},{"text":"高風險責任","links":[]},{"text":"強化責任分配、救濟、損害填補與必要保險。","links":[]}],[{"text":"第18條","links":[]},{"text":"驗證與標準","links":[]},{"text":"推動評測、驗證、標準與信任機制。","links":[]}],[{"text":"第19條","links":[]},{"text":"政府使用AI","links":[]},{"text":"政府應辦理風險評估並建立使用規範、內控及監督。","links":[]}],[{"text":"第20條","links":[]},{"text":"施行","links":[]},{"text":"規定法律施行安排。","links":[]}]]}]},{"title":"5｜公務機關使用生成式AI十點指引","blocks":[{"type":"table","rows":[[{"text":"點次","links":[]},{"text":"主題","links":[]},{"text":"作答關鍵","links":[]}],[{"text":"1","links":[]},{"text":"先理解目的與風險","links":[]},{"text":"生成式AI可增進效率，但伴隨幻覺、偏誤、資安、個資與權利風險。","links":[]}],[{"text":"2","links":[]},{"text":"人類為主","links":[]},{"text":"維持人類最終目的與專業判斷，不取代自主、創造力與人際互動。","links":[]}],[{"text":"3","links":[]},{"text":"秘密文書禁用","links":[]},{"text":"秘密文書應由承辦人撰寫，不得使用生成式AI。","links":[]}],[{"text":"4","links":[]},{"text":"敏感資料不得外送","links":[]},{"text":"不得輸入機密、個資、未公開資訊或提出相關問題；封閉環境亦須先確認安全與分級。","links":[]}],[{"text":"5","links":[]},{"text":"不得完全信任","links":[]},{"text":"輸出須查證，不得直接作成行政行為或作為唯一依據。","links":[]}],[{"text":"6","links":[]},{"text":"適度揭露","links":[]},{"text":"依使用情境與影響適當揭露AI參與。","links":[]}],[{"text":"7","links":[]},{"text":"遵守法規與內控","links":[]},{"text":"遵守資安、個資、著作權及資訊規範；機關可訂更具體控制。","links":[]}],[{"text":"8","links":[]},{"text":"廠商同樣受約束","links":[]},{"text":"契約應要求委外廠商遵守指引與機關規範。","links":[]}],[{"text":"9","links":[]},{"text":"準用對象","links":[]},{"text":"公營事業、學校、行政法人與政府捐助財團法人等可準用。","links":[]}],[{"text":"10","links":[]},{"text":"其他機關參考","links":[]},{"text":"行政院以外機關可參考並依權責制定規範。","links":[]}]]}]},{"title":"6｜公部門AI生命週期、資料品質與驗收","blocks":[{"type":"table","rows":[[{"text":"階段","links":[]},{"text":"必做治理","links":[]}],[{"text":"立案與問題定義","links":[]},{"text":"需求、公共價值、利害關係人、風險初評、資料與資源可行性。","links":[]}],[{"text":"資料探索與模型開發","links":[]},{"text":"資料法源與品質、代表性、標註、模型／工具選型、版本與實驗紀錄。","links":[]}],[{"text":"驗證、部署與試辦","links":[]},{"text":"技術指標、系統穩定、UX、無障礙、公平、資安、人工接管與驗收。","links":[]}],[{"text":"營運監測與退場","links":[]},{"text":"漂移、事故、群體差異、成本、供應商變更、重訓／停用、資料與紀錄處置。","links":[]}]]},{"type":"paragraph","text":"資料品質四面向：完整性（有沒有缺）｜正確性（值是否對）｜真實性／可信度（來源是否可信）｜時效性（是否夠新）。","links":[]},{"type":"paragraph","text":"驗收不能只看模型分數：還要看系統穩定與反應時間、使用者體驗與無障礙、公平性、文件／程式／中繼資料完整、資安與人工接管。","links":[]}]},{"title":"7｜AI風險分級與評測十面向","blocks":[{"type":"table","rows":[[{"text":"風險層級","links":[]},{"text":"判斷與控制","links":[]}],[{"text":"不可接受／禁止","links":[]},{"text":"操控、侵害基本權或造成不可接受危害的用途；原則上禁止或不得部署。","links":[]}],[{"text":"高風險","links":[]},{"text":"關鍵基礎設施、生物辨識、教育／就業、信用／福利、執法、邊境、司法／民主等重大影響。","links":[]}],[{"text":"有限風險","links":[]},{"text":"聊天機器人、情緒或生物分類、深偽／合成內容等，重點常在透明與告知。","links":[]}],[{"text":"低風險","links":[]},{"text":"遊戲、垃圾郵件過濾等；仍需基本安全、法遵與品質管理。","links":[]}]]},{"type":"table","rows":[[{"text":"評測面向","links":[]},{"text":"一眼辨識","links":[]}],[{"text":"安全性","links":[]},{"text":"避免正常與可預見誤用造成傷害","links":[]}],[{"text":"可解釋性","links":[]},{"text":"能以適當方式說明主要因素、限制與結果","links":[]}],[{"text":"韌性","links":[]},{"text":"面對擾動、攻擊或環境變化仍能維持／恢復","links":[]}],[{"text":"公平性","links":[]},{"text":"避免不合理群體差異與歧視","links":[]}],[{"text":"準確性","links":[]},{"text":"輸出與真值或規格的接近程度","links":[]}],[{"text":"透明性","links":[]},{"text":"揭露AI使用、能力、限制與重要資訊","links":[]}],[{"text":"問責性","links":[]},{"text":"責任角色、紀錄、監督與救濟清楚","links":[]}],[{"text":"可靠性","links":[]},{"text":"在既定條件與時間下穩定符合要求","links":[]}],[{"text":"隱私性","links":[]},{"text":"合法、必要、最小化並保護個人資料","links":[]}],[{"text":"資安性","links":[]},{"text":"防止未授權存取、竄改、洩漏與攻擊","links":[]}]]}]},{"title":"8｜著作權與生成式AI高頻考點","blocks":[{"type":"table","rows":[[{"text":"四步拆題｜①是否為受保護著作／人類創作？②誰是著作人與財產權人？③行為是重製、改作、公開傳輸或其他利用？④是否有授權或合理使用依據？","links":[]}]]},{"type":"table","rows":[[{"text":"條文／主題","links":[]},{"text":"考前定位","links":[]}],[{"text":"§3","links":[]},{"text":"著作、著作人、重製、改作等定義；AI不因工具名稱改變利用行為性質。","links":[]}],[{"text":"§9","links":[]},{"text":"法令、公文、通用符號／表格、依法考試試題等不得為著作權標的。","links":[]}],[{"text":"§10、§10-1","links":[]},{"text":"著作完成時享有權利；保護表達，不及思想、程序、系統與概念。","links":[]}],[{"text":"§11","links":[]},{"text":"職務著作：著作人與財產權可依契約；受僱人包括公務員。","links":[]}],[{"text":"§12","links":[]},{"text":"出資聘請：原則受聘人為著作人，財產權依契約；未約定多歸受聘人。","links":[]}],[{"text":"§44","links":[]},{"text":"政府因立法／行政必要得在合理範圍重製作內部參考，不得不當損害權利人。","links":[]}],[{"text":"§52、§64","links":[]},{"text":"正當目的可在合理範圍引用已公開著作，並應合理明示出處。","links":[]}],[{"text":"§65","links":[]},{"text":"合理使用四因素：目的性質、著作性質、質量比例、對市場／價值影響。","links":[]}],[{"text":"§90-4～§90-12","links":[]},{"text":"網路服務提供者免責須符合政策、通知、移除／阻斷與回復等法定程序。","links":[]}]]},{"type":"bullet","text":"純AI生成：若無人類實際創意投入，AI本身不能成為著作人；若人類把AI作為輔助工具並有實際創作，該創意部分可能受保護。","links":[]},{"type":"bullet","text":"生成結果侵權：即使輸出本身不受保護，若與他人原作具原創性的表達實質近似，商業利用仍可能侵權。","links":[]},{"type":"bullet","text":"委外／採購：『成果歸機關』過度籠統；應約定資料、提示、模型、輸出、開源元件、第三方權利、商用與再訓練。","links":[]}]},{"title":"9｜50題官方樣題的命題觀察","blocks":[{"type":"table","rows":[[{"text":"次層面","links":[]},{"text":"樣題常見包裝","links":[]}],[{"text":"1.1","links":[]},{"text":"LMM／LLM、Human-in-the-loop、生成與判別、說謊者紅利、數位包容、Agentic AI、基本法 最後衝刺重點"},{"id":"C002","category":"sprint","group":"30個最後衝刺重點","title":"衝刺重點 2｜六次層面樣題配比為7／7／8／10／8／10","front":"看到「六次層面樣題配比為7／7／8／10／8／10」，你能說出完整判斷嗎？","fields":[{"label":"必背內容","text":"六次層面樣題配比為7／7／8／10／8／10；治理三章合計56%。"}],"sourceSection":"2｜30個最後衝刺重點"},{"id":"C003","category":"sprint","group":"30個最後衝刺重點","title":"衝刺重點 3｜提示四元素","front":"看到「提示四元素」，你能說出完整判斷嗎？","fields":[{"label":"必背內容","text":"提示四元素：角色、任務、背景、格式；加上限制、來源與查證要求更穩。"}],"sourceSection":"2｜30個最後衝刺重點"},{"id":"C004","category":"sprint","group":"30個最後衝刺重點","title":"衝刺重點 4｜AI輸出流暢不等於正確","front":"看到「AI輸出流暢不等於正確」，你能說出完整判斷嗎？","fields":[{"label":"必背內容","text":"AI輸出流暢不等於正確；法條、數字、日期、來源逐項核對。"}],"sourceSection":"2｜30個最後衝刺重點"},{"id":"C005","category":"sprint","group":"30個最後衝刺重點","title":"衝刺重點 5｜秘密文書不得使用生成式AI","front":"看到「秘密文書不得使用生成式AI」，你能說出完整判斷嗎？","fields":[{"label":"必背內容","text":"秘密文書不得使用生成式AI；機密、個資、未公開資訊不得輸入外部工具。"}],"sourceSection":"2｜30個最後衝刺重點"},{"id":"C006","category":"sprint","group":"30個最後衝刺重點","title":"衝刺重點 6｜AI輸出不得直接作成行政行為或作為唯一依據","front":"看到「AI輸出不得直接作成行政行為或作為唯一依據」，你能說出完整判斷嗎？","fields":[{"label":"必背內容","text":"AI輸出不得直接作成行政行為或作為唯一依據；人類保有實質覆核與最終責任。"}],"sourceSection":"2｜30個最後衝刺重點"},{"id":"C007","category":"sprint","group":"30個最後衝刺重點","title":"衝刺重點 7｜基本法七原則","front":"看到「基本法七原則」，你能說出完整判斷嗎？","fields":[{"label":"必背內容","text":"基本法七原則：永人隱安透公責。"}],"sourceSection":"2｜30個最後衝刺重點"},{"id":"C008","category":"sprint","group":"30個最後衝刺重點","title":"衝刺重點 8｜高風險看用途與影響，不只看模型大小","front":"看到「高風險看用途與影響，不只看模型大小」，你能說出完整判斷嗎？","fields":[{"label":"必背內容","text":"高風險看用途與影響，不只看模型大小；控制含評估、紀錄、監督、救濟。"}],"sourceSection":"2｜30個最後衝刺重點"},{"id":"C009","category":"sprint","group":"30個最後衝刺重點","title":"衝刺重點 9｜資料品質四字","front":"看到「資料品質四字」，你能說出完整判斷嗎？","fields":[{"label":"必背內容","text":"資料品質四字：完整、正確、真實、即時。"}],"sourceSection":"2｜30個最後衝刺重點"},{"id":"C010","category":"sprint","group":"30個最後衝刺重點","title":"衝刺重點 10｜評測十面向","front":"看到「評測十面向」，你能說出完整判斷嗎？","fields":[{"label":"必背內容","text":"評測十面向：安全、解釋、韌性、公平、準確、透明、問責、可靠、隱私、資安。"}],"sourceSection":"2｜30個最後衝刺重點"},{"id":"C011","category":"sprint","group":"30個最後衝刺重點","title":"衝刺重點 11｜分類指標依錯誤成本選precision／recall／F1","front":"看到「分類指標依錯誤成本選precision／recall／F1」，你能說出完整判斷嗎？","fields":[{"label":"必背內容","text":"分類指標依錯誤成本選precision／recall／F1；迴歸常見MAE／MSE／R²。"}],"sourceSection":"2｜30個最後衝刺重點"},{"id":"C012","category":"sprint","group":"30個最後衝刺重點","title":"衝刺重點 12｜RAG補充可更新知識","front":"看到「RAG補充可更新知識」，你能說出完整判斷嗎？","fields":[{"label":"必背內容","text":"RAG補充可更新知識；微調改變行為模式；兩者都不能取消權限與查證。"}],"sourceSection":"2｜30個最後衝刺重點"},{"id":"C013","category":"sprint","group":"30個最後衝刺重點","title":"衝刺重點 13｜代理式AI要有目標、範圍、工具權限、核准點、停止條件與稽核","front":"看到「代理式AI要有目標、範圍、工具權限、核准點、停止條件與稽核」，你能說出完整判斷嗎？","fields":[{"label":"必背內容","text":"代理式AI要有目標、範圍、工具權限、核准點、停止條件與稽核。"}],"sourceSection":"2｜30個最後衝刺重點"},{"id":"C014","category":"sprint","group":"30個最後衝刺重點","title":"衝刺重點 14｜提示注入常藏在外部文件","front":"看到「提示注入常藏在外部文件」，你能說出完整判斷嗎？","fields":[{"label":"必背內容","text":"提示注入常藏在外部文件；把外部內容視為資料，不得覆寫高階規則。"}],"sourceSection":"2｜30個最後衝刺重點"},{"id":"C015","category":"sprint","group":"30個最後衝刺重點","title":"衝刺重點 15｜最小權限、職務分離、日誌、事件應變是Agentic AI基本防線","front":"看到「最小權限、職務分離、日誌、事件應變是Agentic AI基本防線」，你能說出完整判斷嗎？","fields":[{"label":"必背內容","text":"最小權限、職務分離、日誌、事件應變是Agentic AI基本防線。"}],"sourceSection":"2｜30個最後衝刺重點"},{"id":"C016","category":"sprint","group":"30個最後衝刺重點","title":"衝刺重點 16｜公有雲快但控制依條款","front":"看到「公有雲快但控制依條款」，你能說出完整判斷嗎？","fields":[{"label":"必背內容","text":"公有雲快但控制依條款；地端控制較多但成本與維運較高，沒有零風險模式。"}],"sourceSection":"2｜30個最後衝刺重點"},{"id":"C017","category":"sprint","group":"30個最後衝刺重點","title":"衝刺重點 17｜數位包容","front":"看到「數位包容」，你能說出完整判斷嗎？","fields":[{"label":"必背內容","text":"數位包容：保留替代管道、無障礙、語言與第一線支援。"}],"sourceSection":"2｜30個最後衝刺重點"},{"id":"C018","category":"sprint","group":"30個最後衝刺重點","title":"衝刺重點 18｜自動寄提醒與自動決定權益風險不同","front":"看到「自動寄提醒與自動決定權益風險不同」，你能說出完整判斷嗎？","fields":[{"label":"必背內容","text":"自動寄提醒與自動決定權益風險不同；越接近法律效果，監督越強。"}],"sourceSection":"2｜30個最後衝刺重點"},{"id":"C019","category":"sprint","group":"30個最後衝刺重點","title":"衝刺重點 19｜上線不是終點","front":"看到「上線不是終點」，你能說出完整判斷嗎？","fields":[{"label":"必背內容","t ],"sourceSection":"2｜30個最後衝刺重點"},{"id":"C028","category":"sprint","group":"30個最後衝刺重點","title":"衝刺重點 28｜人工在迴路要有資訊、時間、能力與權限","front":"看到「人工在迴路要有資訊、時間、能力與權限」，你能說出完整判斷嗎？","fields":[{"label":"必背內容","text":"人工在迴路要有資訊、時間、能力與權限；形式按確認不算有效監督。"}],"sourceSection":"2｜30個最後衝刺重點"},{"id":"C029","category":"sprint","group":"30個最後衝刺重點","title":"衝刺重點 29｜外包不外卸","front":"看到「外包不外卸」，你能說出完整判斷嗎？","fields":[{"label":"必背內容","text":"外包不外卸：契約需寫資料、權利、資安、紀錄、更新、事故、移轉與終止。"}],"sourceSection":"2｜30個最後衝刺重點"},{"id":"C030","category":"sprint","group":"30個最後衝刺重點","title":"衝刺重點 30｜遇到兩個看似正確選項，優先選『風險相稱、可查證、可追溯、有人負責』者","front":"看到「遇到兩個看似正確選項，優先選『風險相稱、可查證、可追溯、有人負責』者」，你能說出完整判斷嗎？","fields":[{"label":"必背內容","text":"遇到兩個看似正確選項，優先選『風險相稱、可查證、可追溯、有人負責』者。"}],"sourceSection":"2｜30個最後衝刺重點"},{"id":"C031","category":"chapters","group":"1.1","title":"1.1 記憶句","front":"請回想 1.1 的章節記憶句。","fields":[{"label":"記憶句","text":"先分『做什麼』，再看『怎麼學』，最後問『誰負責』。"}],"sourceSection":"3｜1.1 AI基礎概念與社會影響"},{"id":"C032","category":"chapters","group":"1.1","title":"1.1｜01｜人工智慧的核心概念","front":"「人工智慧的核心概念」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"AI系統依輸入推論或生成輸出，以達成預先設定或明示／默示的目標"},{"label":"常見陷阱／為何","text":"判斷AI不能只看是否自動化；重點是利用模型或計算方法進行推論、預測、建議或生成。"}],"sourceSection":"3｜1.1 AI基礎概念與社會影響"},{"id":"C033","category":"chapters","group":"1.1","title":"1.1｜02｜規則式系統與機器學習","front":"「規則式系統與機器學習」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"規則式系統由人明定規則；機器學習則從資料中學得模式"},{"label":"常見陷阱／為何","text":"考題常以『誰決定規則』區分：人工編寫規則與資料驅動學習並不相同。"}],"sourceSection":"3｜1.1 AI基礎概念與社會影響"},{"id":"C034","category":"chapters","group":"1.1","title":"1.1｜03｜監督式學習","front":"「監督式學習」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"以含標記答案的資料訓練模型做分類或迴歸"},{"label":"常見陷阱／為何","text":"監督式學習有明確標籤；分類預測類別，迴歸預測連續數值。"}],"sourceSection":"3｜1.1 AI基礎概念與社會影響"},{"id":"C035","category":"chapters","group":"1.1","title":"1.1｜04｜非監督式學習","front":"「非監督式學習」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"在沒有既定標籤的資料中探索群聚、結構或異常"},{"label":"常見陷阱／為何","text":"非監督式學習常用於分群、降維與異常偵測，重點是沒有預先標註的目標答案。"}],"sourceSection":"3｜1.1 AI基礎概念與社會影響"},{"id":"C036","category":"chapters","group":"1.1","title":"1.1｜05｜強化學習","front":"「強化學習」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"代理在環境中採取行動，依獎勵訊號逐步學習策略"},{"label":"常見陷阱／為何","text":"強化學習的關鍵是狀態、行動、獎勵與長期策略，而不是一次性的標記答案。"}],"sourceSection":"3｜1.1 AI基礎概念與社會影響"},{"id":"C037","category":"chapters","group":"1.1","title":"1.1｜06｜深度學習與神經網路","front":"「深度學習與神經網路」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"以多層神經網路從大量資料學習階層式特徵"},{"label":"常見陷阱／為何","text":"深度學習擅長影像、語音與語言等複雜資料，但可能需要大量資料與算力，也可能較難解釋。"}],"sourceSection":"3｜1.1 AI基礎概念與社會影響"},{"id":"C038","category":"chapters","group":"1.1","title":"1.1｜07｜生成式與判別／預測式AI","front":"「生成式與判別／預測式AI」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"生成式AI產生新內容；判別或預測式AI多用於分類、評分或預測"},{"label":"常見陷阱／為何","text":"先看輸出型態：生成新文本／圖像，或判斷既有資料的類別與風險。"}],"sourceSection":"3｜1.1 AI基礎概念與社會影響"},{"id":"C039","category":"chapters","group":"1.1","title":"1.1｜08｜大型語言模型（LLM）","front":"「大型語言模型（LLM）」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"以大量語料學習詞元序列關係，依上下文預測並生成語言"},{"label":"常見陷阱／為何","text":"LLM依統計模式生成最可能的後續內容，流暢不等於真實，也不代表理解或授權無虞。"}],"sourceSection":"3｜1.1 AI基礎概念與社會影響"},{"id":"C040","category":"chapters","group":"1.1","title":"1.1｜09｜生成式AI幻覺","front":"「生成式AI幻覺」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"模型可能產生語句流暢但事實、數字或引據錯誤的內容"},{"label":"常見陷阱／為何","text":"幻覺必須用可靠來源、交叉查核與人工覆核控制，不能以語氣自信判定正確。"}],"sourceSection":"3｜1.1 AI基礎概念與社會影響"},{"id":"C041","category":"chapters","group":"1.1","title":"1.1｜10｜資料與演算法偏誤","front":"「資料與演算法偏誤」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"訓練資料、標記、特徵或設計選擇可能使特定群體受到系統性不利"},{"label":"常見陷阱／為何","text":"公平評估要看資料代表性與分群結果，不能只看整體平均。"}],"sourceSection":"3｜1.1 AI基礎概念與社會影響"},{"id":"C042","category":"chapters","group":"1.1","title":"1.1｜11｜可解釋性","front":"「可解釋性」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"能以適合利害關係人的方式說明主要因素、限制與判斷依據"},{"label":"常見陷阱／為何","text":"可解釋性重點是讓適當對象理解判斷邏輯、重要因素與限制；不等於毫無保留公開機密。"}],"sourceSection":"3｜1.1 AI基礎概念與社會影響"},{"id":"C043","category":"chapters","group":"1.1","title":"1.1｜12｜隱私與資料最小化","front":"「隱私與資料最小化」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"只蒐集與處理達成目的所必要的資料，並限制用途與保存"},{"label":"常見陷阱／為何","text":"資料最小化可降低外洩、誤用與再識別風險，並應搭配目的限制、權限與保存政策。"}],"sourceSection":"3｜1.1 AI基礎概念與社會影響"},{"id":"C044","category":"chapters","group":"1.1","title":"1.1｜13｜透明性","front":"「透明性」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"適度揭露使用AI、功能範圍、限制與重要影響，使使用者不被誤導"},{"label":"常見陷阱／為何","text":"透明是可理解、適度、與風險相稱的資訊揭露，不要求不加區分地公開所有資訊。"}],"sourceSection":"3｜1.1 AI基礎概念與社會影響"},{"id":"C045","category":"chapters","group":"1.1","title":"1.1｜14｜人類監督與最終責任","front":"「人類監督與最終責任」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"重要行政判斷應保留具權限人員的實質覆核、介入與更正能力"},{"label":"常見陷阱／為何","text":"有效的人類監督必須有資訊、時間、能力與權限，不是形式勾選；機關仍負最終責任。"}],"sourceSection":"3｜1.1 AI基礎概念與社會影響"},{"id":"C046","category":"chapters","group":"1.1","title":"1.1｜15｜深偽與合成內容","front":"「深偽與合成內容」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"AI可生成高度逼真的影音，須以來源驗證、標示與偵測降低冒用及誤導"},{"label":"常見陷阱／為何","text":"深偽可能影響名譽、民主、詐騙與公共信任；應採多重查證，不能依單一視覺線索。"}],"sourceSection":"3｜1.1 AI基礎概念與社會影響"},{"id":"C047","category":"chapters","group":"1.1","title":"1.1｜16｜說謊者紅利（liar's dividend）","front":"「說謊者紅利（liar's dividend）」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"因深偽普及，真實證據也可能被當事人藉口稱為AI偽造"},{"label":"常見陷阱／為何","text":"深偽不只製造假內容，也可能讓真內容遭否認，削弱證據與公共信任。"}],"sourceSection":"3｜1.1 AI基礎概念與社會影響"},{"id":"C048","category":"chapters","group":"1.1","title":"1.1｜17｜數位落差與包容","front":"「數位落差與包容」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"AI服務應保留替代管道、無障礙設計與協助，避免弱勢被排除"},{"label":"常見陷阱／為何","text":"公共服務不能把成本與能力門檻轉嫁給民眾；可近用性與多元管道是重要考點。"}],"sourceSection":"3｜1.1 AI基礎概念與社會影響"},{"id":"C049","category":"chapters","group":"1.1","title":"1.1｜18｜代理式AI（Agentic AI）","front":"「代理式AI（Agentic AI）」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"能依目標規劃多步任務、呼叫工具並根據結果調整行動"},{"label":"常見陷阱／為何","text":"代理式AI增加行動能力，也放大錯誤與權限風險，須設定目標、範圍、工具權限、停止條件與監督點。"}],"sourceSection":"3｜1.1 AI基礎概念與社會影響"},{"id":"C050","category":"chapters","group":"1.1","title":"1.1｜19｜模型情境協定（MCP）與工具整合","front":"「模型情境協定（MCP）與工具整合」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"以標準化方式讓模型連接資料來源或工具，仍需驗證來源與控管權限"},{"label":"常見陷阱／為何","text":"標準化整合降低介接成本，但不會消除身分驗證、最小權限、輸入輸出檢查與稽核需求。"}],"sourceSection":"3｜1.1 AI基礎概念與社會影響"},{"id":"C051","category":"chapters","group":"1.1","title":"1.1｜20｜邊緣AI（Edge AI）","front":"「邊緣AI（Edge AI）」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"在靠近資料來源的裝置上推論，可降低延遲與傳輸，但受裝置資源限制"},{"label":"常見陷阱／為何","text":"邊緣部署常用於低延遲或不宜大量上傳的情境；仍須管理裝置、模型更新與存取。"}],"sourceSection":"3｜1.1 AI基礎概念與社會影響"},{"id":"C052","category":"chapters","group":"1.1","title":"1.1｜21｜模型漂移（Model Drift）","front":"「模型漂移（Model Drift）」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"上線後資料或環境改變，使模型表現隨時間下降或產生偏差"},{"label":"常見陷阱／為何","text":"上線不是終點；需持續監測資料分布、績效、群體差異，設定告警與重訓／停用機制。"}],"sourceSection":"3｜1.1 AI基礎概念與社會影響"},{"id":"C053","category":"chapters","group":"1.2","title":"1.2 記憶句","front":"請回想 1.2 的章節記憶句。","fields":[{"label":"記憶句","text":"角—任—背—格；先定界、再生成、後查證。"}],"sourceSection":"4｜1.2 生成式AI與人機互動"},{"id":"C054","category":"chapters","group":"1.2","title":"1.2｜01｜提示（Prompt）","front":"「提示（Prompt）」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"提供給生成式模型的指令、問題、背景或範例，用來引導輸出"},{"label":"常見陷阱／為何","text":"提示影響輸出方向與格式，但不能取代資料品質、查證與治理。"}],"sourceSection":"4｜1.2 生成式AI與人機互動"},{"id":"C055","category":"chapters","group":"1.2","title":"1.2｜02｜角色設定","front":"「角色設定」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"指定模型應採取的專業視角與服務對象，以調整語氣和判斷框架"},{"label":"常見陷阱／為何","text":"角色是提示框架，不是資格認證；仍要清楚任務與查證。"}],"sourceSection":"4｜1.2 生成式AI與人機互動"},{"id":"C056","category":"chapters","group":"1.2","title":"1.2｜03｜任務設定","front":"「任務設定」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"以明確動詞說明要完成的工作與成功條件"},{"label":"常見陷阱／為何","text":"明確的行動動詞、目的與完成條件可降低歧義。"}],"sourceSection":"4｜1.2 生成式AI與人機互動"},{"id":"C057","category":"chapters","group":"1.2","title":"1.2｜04｜背景與受眾","front":"「背景與受眾」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"提供必要脈絡、資料範圍、對象與既有條件"},{"label":"常見陷阱／為何","text":"背景要足夠且相關，並遵守資料輸入限制；受眾會影響語氣與細節。"}],"sourceSection":"4｜1.2 生成式AI與人機互動"},{"id":"C058","category":"chapters","group":"1.2","title":"1.2｜05｜輸出格式","front":"「輸出格式」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"明定欄位、長度、語言、結構或範例，使結果可直接檢查與再利用"},{"label":"常見陷阱／為何","text":"格式約束提升一致性與可驗證性，但內容仍需查核。"}],"sourceSection":"4｜1.2 生成式AI與人機互動"},{"id":"C059","category":"chapters","group":"1.2","title":"1.2｜06｜目標與明確動詞","front":"「目標與明確動詞」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"使用摘要、比較、分類、改寫、擷取等明確動詞，說清楚輸出用途"},{"label":"常見陷阱／為何","text":"提示的核心不是堆砌關鍵字，而是讓模型理解要執行的可驗證動作。"}],"sourceSection":"4｜1.2 生成式AI與人機互動"},{"id":"C060","category":"chapters","group":"1.2","title":"1.2｜07｜限制條件與邊界","front":"「限制條件與邊界」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"明定可用資料、禁止事項、字數、時限與不確定時的處理方式"},{"label":"常見陷阱／為何","text":"限制條件可降低越權與幻覺；遇到資料不足應標示未知或要求補充。"}],"sourceSection":"4｜1.2 生成式AI與人機互動"},{"id":"C061","category":"chapters","group":"1.2","title":"1.2｜08｜零樣本提示","front":"「零樣本提示」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"不提供示例，僅以清楚指令要求模型完成任務"},{"label":"常見陷阱／為何","text":"零樣本適合一般且清楚的任務；若格式或判準複雜，可改用少樣本。"}],"sourceSection":"4｜1.2 生成式AI與人機互動"},{"id":"C062","category":"chapters","group":"1.2","title":"1.2｜09｜少樣本提示","front":"「少樣本提示」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"提供少量輸入輸出示例，讓模型模仿格式或判準"},{"label":"常見陷阱／為何","text":"少樣本可提高格式與判準一致性，但示例必須正確、具代表性且不含敏感資料。"}],"sourceSection":"4｜1.2 生成式AI與人機互動"},{"id":"C063","category":"chapters","group":"1.2","title":"1.2｜10｜步驟化推理","front":"「步驟化推理」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"將複雜任務拆成可檢查的中間步驟，並要求呈現必要依據"},{"label":"常見陷阱／為何","text":"可要求可驗證的計算、依據與工作步驟；重點是可檢查，不是索取內部隱藏推理。"}],"sourceSection":"4｜1.2 生成式AI與人機互動"},{"id":"C064","category":"chapters","group":"1.2","title":"1.2｜11｜多輪迭代","front":"「多輪迭代」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"先產出草稿，再依缺口、語氣、格式與查證結果逐輪修正"},{"label":"常見陷阱／為何","text":"高品質輸出通常經過提問、檢查、補充與重寫；每輪要維持目標與版本可追溯。"}],"sourceSection":"4｜1.2 生成式AI與人機互動"},{"id":"C065","category":"chapters","group":"1.2","title":"1.2｜12｜結構化輸出","front":"「結構化輸出」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"要求固定欄位或JSON／表格，便於驗證、匯入與後續處理"},{"label":"常見陷阱／為何","text":"結構能提升機器可讀性，但欄位驗證、例外處理與資料品質仍不可省。"}],"sourceSection":"4｜1.2 生成式AI與人機互動"},{"id":"C066","category":"chapters","group":"1.2","title":"1.2｜13｜事實查核","front":"「事實查核」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"以權威且最新來源逐項核對名稱、日期、數字與結論"},{"label":"常見陷阱／為何","text":"查核要確認來源真實、日期適用、內容真正支持主張，必要時跨來源比對。"}],"sourceSection":"4｜1.2 生成式AI與人機互動"},{"id":"C067","category":"chapters","group":"1.2","title":"1.2｜14｜引據與可追溯來源","front":"「引據與可追溯來源」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"要求提供可開啟的來源，並檢查引文、條號與主張是否相符"},{"label":"常見陷阱／為何","text":"生成式AI可能虛構文獻與法條；可追溯性需能回到原始或權威資料。"}],"sourceSection":"4｜1.2 生成式AI與人機互動"},{"id":"C068","category":"chapters","group":"1.2","title":"1.2｜15｜紅隊測試","front":"「紅隊測試」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"刻意以極端、繞過、模糊或惡意輸入測試系統弱點"},{"label":"常見陷阱／為何","text":"紅隊測試用來發現越權、偏誤、提示注入、洩密與失敗模式，並回饋控制措施。"}],"sourceSection":"4｜1.2 生成式AI與人機互動"},{"id":"C069","category":"chapters","group":"1.2","title":"1.2｜16｜法律內容生成","front":"「法律內容生成」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"把AI當檢索與草擬輔助，逐條核對現行法、適用日期與事實"},{"label":"常見陷阱／為何","text":"法律資訊具有時效與精確性要求，必須由專業人員核對原始法源。"}],"sourceSection":"4｜1.2 生成式AI與人機互動"},{"id":"C070","category":"chapters","group":"1.2","title":"1.2｜17｜公文草擬與人工覆核","front":"「公文草擬與人工覆核」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"AI可產生草稿，但承辦與權責人員須核對事實、法規、格式、語氣並負責"},{"label":"常見陷阱／為何","text":"參考指引禁止完全信任或直接以未經確認的輸出作成行政行為或唯一依據。"}],"sourceSection":"4｜1.2 生成式AI與人機互動"},{"id":"C071","category":"chapters","group":"1.2","title":"1.2｜18｜政策白話化","front":"「政策白話化」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"在不改變權利義務與法定要件下，改寫為受眾可理解的語言"},{"label":"常見陷阱／為何","text":"白話化要同時維持精確、完整與可追溯，最好附原文或官方連結。"}],"sourceSection":"4｜1.2 生成式AI與人機互動"},{"id":"C072","category":"chapters","group":"1.2","title":"1.2｜19｜敏感資訊輸入邊界","front":"「敏感資訊輸入邊界」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"在使用外部生成式AI前，先排除機密、個資、未公開及其他受限制資料"},{"label":"常見陷阱／為何","text":"輸入前治理比事後補救重要；去識別也要評估再識別與服務條款。"}],"sourceSection":"4｜1.2 生成式AI與人機互動"},{"id":"C073","category":"chapters","group":"1.2","title":"1.2｜20｜代理任務監督者","front":"「代理任務監督者」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"設定目標、範圍、輸入／系統邊界、核准點、停止條件與異常處置"},{"label":"常見陷阱／為何","text":"Agentic AI須用明確權限與人類介入點控制多步行動，尤其是對外發布、付款、刪除或權利影響。"}],"sourceSection":"4｜1.2 生成式AI與人機互動"},{"id":"C074","category":"chapters","group":"1.2","title":"1.2｜21｜指令優先序","front":"「指令優先序」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"系統與機關政策等高階規則應優先於使用者或外部文件中的衝突指令"},{"label":"常見陷阱／為何","text":"建立指令層級並把外部內容視為資料，可降低提示注入與越權。"}],"sourceSection":"4｜1.2 生成式AI與人機互動"},{"id":"C075","category":"chapters","group":"1.3","title":"1.3 記憶句","front":"請回想 1.3 的章節記憶句。","fields":[{"label":"記憶句","text":"任務配模型、資料配環境、風險配監督。"}],"sourceSection":"5｜1.3 AI應用與公共服務轉型策略"},{"id":"C076","category":"chapters","group":"1.3","title":"1.3｜01｜依任務選擇預測或生成模型","front":"「依任務選擇預測或生成模型」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"分類、評分、預測與內容生成的目的不同，應先定義任務再選模型"},{"label":"常見陷阱／為何","text":"任務—資料—輸出—風險是模型選擇起點；不是功能越多越適合。"}],"sourceSection":"5｜1.3 AI應用與公共服務轉型策略"},{"id":"C077","category":"chapters","group":"1.3","title":"1.3｜02｜問題定義與成功條件","front":"「問題定義與成功條件」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"先界定服務痛點、對象、預期效益、限制與可衡量指標"},{"label":"常見陷阱／為何","text":"公部門AI導入應從問題與公共價值出發，並在技術前確認需求、資料與流程可行性。"}],"sourceSection":"5｜1.3 AI應用與公共服務轉型策略"},{"id":"C078","category":"chapters","group":"1.3","title":"1.3｜03｜資料敏感度與部署選擇","front":"「資料敏感度與部署選擇」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"資料越敏感、權利影響越高，越需要受控環境、權限與審核"},{"label":"常見陷阱／為何","text":"部署模式必須與資料分類、供應商條款、存取控制及退出方案一起評估。"}],"sourceSection":"5｜1.3 AI應用與公共服務轉型策略"},{"id":"C079","category":"chapters","group":"1.3","title":"1.3｜04｜公有雲、私有／地端部署","front":"「公有雲、私有／地端部署」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"公有雲通常導入快；私有或地端可增加控制，但成本、維運與更新負擔較高"},{"label":"常見陷阱／為何","text":"沒有絕對最佳部署；應比較資料流、合約、權限、更新、監測、成本與業務持續性。"}],"sourceSection":"5｜1.3 AI應用與公共服務轉型策略"},{"id":"C080","category":"chapters","group":"1.3","title":"1.3｜05｜在地模型與TAIDE","front":"「在地模型與TAIDE」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"在地語言文化與政府情境可改善適切性，但仍須以任務資料評測"},{"label":"常見陷阱／為何","text":"在地化是選型因素，不是品質與法遵保證；需以實際使用案例比較。"}],"sourceSection":"5｜1.3 AI應用與公共服務轉型策略"},{"id":"C081","category":"chapters","group":"1.3","title":"1.3｜06｜邊緣部署策略","front":"「邊緣部署策略」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"低延遲、連線不穩或資料不宜大量外傳時，可評估在裝置端推論"},{"label":"常見陷阱／為何","text":"邊緣AI可縮短反應與減少傳輸，但算力、功耗、版本與設備安全需管理。"}],"sourceSection":"5｜1.3 AI應用與公共服務轉型策略"},{"id":"C082","category":"chapters","group":"1.3","title":"1.3｜07｜延遲、成本與吞吐量","front":"「延遲、成本與吞吐量」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"模型選型應依可接受反應時間、同時使用量、單次成本與服務層級測試"},{"label":"常見陷阱／為何","text":"效能驗收要在代表性負載與尖峰情境測試，納入API、網路、運算與人工覆核成本。"}],"sourceSection":"5｜1.3 AI應用與公共服務轉型策略"},{"id":"C083","category":"chapters","group":"1.3","title":"1.3｜08｜檢索增強生成（RAG）","front":"「檢索增強生成（RAG）」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"先檢索受控知識來源，再讓模型依檢索內容生成並保留引據"},{"label":"常見陷阱／為何","text":"RAG可提升可追溯與時效，但依賴索引品質、權限、切分、檢索與引用驗證。"}],"sourceSection":"5｜1.3 AI應用與公共服務轉型策略"},{"id":"C084","category":"chapters","group":"1.3","title":"1.3｜09｜微調（Fine-tuning）","front":"「微調（Fine-tuning）」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"以特定資料調整既有模型行為，適合穩定風格或任務模式"},{"label":"常見陷阱／為何","text":"微調與RAG目的不同：前者調整模型行為，後者補充可更新知識；兩者都需資料治理。"}],"sourceSection":"5｜1.3 AI應用與公共服務轉型策略"},{"id":"C085","category":"chapters","group":"1.3","title":"1.3｜10｜API與系統整合","front":"「API與系統整合」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"應使用身分驗證、最小權限、輸入輸出檢查、錯誤處理、速率限制與稽核"},{"label":"常見陷阱／為何","text":"整合會把模型風險帶入業務流程，需用工程與治理控制形成防線。"}],"sourceSection":"5｜1.3 AI應用與公共服務轉型策略"},{"id":"C086","category":"chapters","group":"1.3","title":"1.3｜11｜數位包容的服務設計","front":"「數位包容的服務設計」的正確判斷是什麼？常見陷阱又是什麼？","fields":[{"label":"正確判斷","text":"從不同年齡、語言、障礙、設備與網路
